// ─── SHOOTING ───
function playerShoot(p) {
  p = p || player;
  if (p.shielding || p.shootCooldown > 0 || p.reloading || p.ammo <= 0) return;

  let wep = weapons[p.weapon];
  p.shootCooldown = wep.fireRate;
  let pellets = wep.pellets || 1;

  for (let i = 0; i < pellets; i++) {
    let spread = (Math.random() - 0.5) * wep.spread * 2;
    let bx = p.x + p.facing * 20;
    let by = p.y + 14;
    bullets.push({
      x: bx, y: by,
      vx: Math.cos(spread) * wep.speed * p.facing,
      vy: Math.sin(spread) * wep.speed,
      damage: wep.damage,
      color: wep.color,
      size: wep.size,
      isPlayer: true,
      life: 80,
      trail: [],
    });
  }

  p.ammo--;
  if (p.ammo <= 0) {
    p.reloading = true;
    p.reloadTimer = 50;
  }

  if (SFX['shoot_' + p.weapon]) SFX['shoot_' + p.weapon]();
  spawnMuzzleFlash(p.x + p.facing * 24, p.y + 14, p.facing);
  spawnCasing(p.x, p.y + 10, p.facing);
  screenShake = Math.max(screenShake, wep.fireRate > 15 ? 4 : 2);
}

function enemyShoot(enemy) {
  let target = getClosestLivingPlayer(enemy.x, enemy.y);
  if (!target) return;
  let dx = target.x - enemy.x;
  let dy = (target.y + target.h / 2) - (enemy.y + enemy.h / 2);
  let dist = Math.sqrt(dx * dx + dy * dy);
  if (dist === 0) return;
  let speed = enemy.bulletSpeed;
  SFX.enemyShoot();
  bullets.push({
    x: enemy.x + enemy.facing * 15,
    y: enemy.y + enemy.h / 2 - 4,
    vx: (dx / dist) * speed,
    vy: (dy / dist) * speed,
    damage: 1,
    color: enemy.color,
    size: 3,
    isPlayer: false,
    life: 120,
    trail: [],
  });
}

// ─── HELPERS ───
function getClosestLivingPlayer(x, y) {
  let players = [player];
  if (player2) players.push(player2);
  players = players.filter(p => p && p.alive);
  if (players.length === 0) return player; // fallback
  let closest = players[0];
  let closestDist = Math.abs(x - closest.x) + Math.abs(y - closest.y);
  for (let i = 1; i < players.length; i++) {
    let d = Math.abs(x - players[i].x) + Math.abs(y - players[i].y);
    if (d < closestDist) {
      closest = players[i];
      closestDist = d;
    }
  }
  return closest;
}

function checkPlayerDeath(p) {
  if (p.health <= 0) {
    p.alive = false;
    SFX.playerDeath();
    spawnExplosion(p.x, p.y + p.h / 2, '#ffe66d', 40);
    let allDead = !player.alive && (!player2 || !player2.alive);
    if (allDead) {
      SFX.gameOver();
      state = 'dead';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('shooterBest', highScore.toString());
      }
    } else {
      let label = (p === player2) ? 'P2 DOWN!' : 'P1 DOWN!';
      addFloatingText(label, p.x, p.y - 20, '#ff6b6b', 24, 120);
    }
  }
}

function updatePlayerMovement(p, keysConfig, dt) {
  if (!p || !p.alive) return;

  // Shield
  let wasShielding = p.shielding;
  p.shielding = isKeyPressed(keysConfig.shield) && p.shieldEnergy > 0;
  if (p.shielding && !wasShielding) SFX.shieldUp();
  if (p.shielding) {
    p.shieldEnergy = Math.max(0, p.shieldEnergy - dt);
    if (p.shieldEnergy <= 0) p.shielding = false;
  } else {
    p.shieldEnergy = Math.min(p.maxShieldEnergy, p.shieldEnergy + dt * 0.4);
  }

  // Health regen
  p.lastHitTimer += dt;
  if (p.lastHitTimer > 240 && p.health < p.maxHealth) {
    if (Math.floor(p.lastHitTimer) % 30 === 0) {
      p.health = Math.min(p.maxHealth, p.health + 1);
    }
  }

  // Movement
  let moveDir = 0;
  if (isKeyPressed(keysConfig.left)) moveDir = -1;
  if (isKeyPressed(keysConfig.right)) moveDir = 1;

  if (!p.dashing) {
    p.vx = moveDir * MOVE_SPEED;
  }

  if (p.dashing) {
    p.dashTimer--;
    if (p.dashTimer <= 0) p.dashing = false;
  }
  if (p.dashCooldown > 0) p.dashCooldown--;
  if (p.invincible > 0) p.invincible--;

  if (moveDir !== 0 && !p.dashing) p.facing = moveDir;

  // Shooting
  let wep = weapons[p.weapon];
  if (isKeyPressed(keysConfig.shoot)) {
    playerShoot(p);
  }
  if (wep.auto && isKeyPressed(keysConfig.shoot) && p.shootCooldown <= 0) {
    playerShoot(p);
  }

  if (p.shootCooldown > 0) p.shootCooldown -= dt;

  // Reload
  if (p.reloading) {
    p.reloadTimer -= dt;
    if (p.reloadTimer <= 0) {
      SFX.reload();
      p.reloading = false;
      p.ammo = weapons[p.weapon].ammo;
    }
  }

  // Physics
  p.vy += GRAVITY * dt;
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  // Trail
  if (p.dashing || Math.abs(p.vx) > 3) {
    p.trail.push({ x: p.x, y: p.y, alpha: 0.5 });
    if (p.trail.length > 8) p.trail.shift();
  } else {
    if (p.trail.length > 0) p.trail.shift();
  }

  // Ground
  p.onGround = false;
  if (p.y + p.h >= GROUND) {
    p.y = GROUND - p.h;
    p.vy = 0;
    p.onGround = true;
    p.jumps = 2;
  }

  // Platform collision
  platforms.forEach(plat => {
    if (p.vy >= 0 &&
        p.x + p.w / 2 > plat.x && p.x - p.w / 2 < plat.x + plat.w &&
        p.y + p.h >= plat.y && p.y + p.h <= plat.y + plat.h + 10) {
      p.y = plat.y - p.h;
      p.vy = 0;
      p.onGround = true;
      p.jumps = 2;
    }
  });

  // Bounds
  p.x = Math.max(p.w / 2, Math.min(canvas.width - p.w / 2, p.x));

  // Weapon timeout
  if (p.weapon !== 'pistol' && p.ammo <= 0 && !p.reloading) {
    p.weapon = 'pistol';
    p.ammo = weapons.pistol.ammo;
    p.maxAmmo = weapons.pistol.ammo;
  }
}

// ─── ONLINE MULTIPLAYER FUNCTIONS ───
function generateRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let code = '';
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

const CLIENT_KEYS = {
  left: ['a', 'arrowleft'],
  right: ['d', 'arrowright'],
  shoot: ['f'],
  shield: ['e'],
  reload: 'r',
  dash: 'q',
  jump: ['w', ' ', 'arrowup']
};

function isClientKeyPressed(action) {
  let k = CLIENT_KEYS[action];
  if (Array.isArray(k)) return k.some(key => keys[key]);
  return !!keys[k];
}

function processRemoteEvent(p, event) {
  if (!p || !p.alive) return;
  if (event === 'jump' && p.jumps > 0) {
    if (p.jumps === 1) SFX.doubleJump(); else SFX.jump();
    p.vy = p.jumps === 2 ? JUMP_FORCE : DOUBLE_JUMP_FORCE;
    p.onGround = false;
    p.jumps--;
    spawnJumpDust(p);
    if (p.jumps === 0) spawnDoubleJumpEffect(p);
  } else if (event === 'dash' && p.dashCooldown <= 0 && !p.dashing) {
    performDash(p);
  } else if (event === 'reload' && !p.reloading && p.ammo < p.maxAmmo) {
    p.reloading = true;
    p.reloadTimer = 40;
  }
}

function startHosting() {
  roomCode = generateRoomCode();
  let peerId = 'gunslinger-' + roomCode;
  connectionStatus = 'Creating room...';

  peer = new Peer(peerId);
  peer.on('open', () => {
    connectionStatus = 'Waiting for player...';
    isHost = true;
    onlineMode = true;
  });

  peer.on('connection', (connection) => {
    conn = connection;
    setupHostConnection();
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      peer.destroy();
      startHosting();
    } else {
      connectionStatus = 'Error: ' + err.type;
    }
  });
}

function joinRoom(code) {
  connectionStatus = 'Connecting...';
  peer = new Peer();

  peer.on('open', () => {
    conn = peer.connect('gunslinger-' + code);
    conn.on('open', () => {
      setupClientConnection();
    });
    conn.on('error', () => {
      connectionStatus = 'Connection failed';
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'peer-unavailable') {
      connectionStatus = 'Room not found';
    } else {
      connectionStatus = 'Error: ' + err.type;
    }
  });
}

function setupHostConnection() {
  connectionStatus = 'Connected!';
  coopMode = true;
  onlineMode = true;
  isHost = true;
  startGame();

  conn.on('data', (data) => {
    if (data.type === 'input') {
      applyRemoteInput(data);
    }
  });

  conn.on('close', () => handleDisconnect());
  conn.on('error', () => handleDisconnect());

  stateSyncInterval = setInterval(() => {
    if (conn && conn.open) {
      sendGameState();
    }
  }, 50);
}

function setupClientConnection() {
  connectionStatus = 'Connected!';
  onlineMode = true;
  isClient = true;
  coopMode = true;

  state = 'levelIntro';
  levelIntroTimer = 180;
  player = createPlayer(canvas.width / 3);
  player2 = createPlayer(canvas.width * 2 / 3, { body: '#27ae60', dash: '#f39c12', skin: '#f4d35e', hat: '#1a5c2e', hatBand: '#f39c12', shoe: '#f39c12' });
  bullets = [];
  enemies = [];
  particles = [];
  powerups = [];
  floatingTexts = [];
  casings = [];
  score = 0;
  level = 1;
  wave = 0;
  generatePlatforms();

  conn.on('data', (data) => {
    if (data.type === 'state') {
      applyHostState(data);
    }
  });

  conn.on('close', () => handleDisconnect());
  conn.on('error', () => handleDisconnect());

  inputSendInterval = setInterval(() => {
    if (conn && conn.open) {
      sendClientInput();
    }
  }, 50);
}

function cleanupOnline() {
  if (stateSyncInterval) { clearInterval(stateSyncInterval); stateSyncInterval = null; }
  if (inputSendInterval) { clearInterval(inputSendInterval); inputSendInterval = null; }
  if (conn) { try { conn.close(); } catch(e) {} conn = null; }
  if (peer) { try { peer.destroy(); } catch(e) {} peer = null; }
  onlineMode = false;
  isHost = false;
  isClient = false;
  disconnected = false;
  disconnectTimer = 0;
  coopMode = false;
  roomCode = '';
  roomCodeInput = '';
  connectionStatus = '';
  sfxBuffer = [];
  floatingTextBuffer = [];
  clientInputState = { keys: { left: false, right: false, shoot: false, shield: false }, events: [] };
}

function handleDisconnect() {
  if (disconnected) return;
  disconnected = true;
  disconnectTimer = 180;
  if (isHost) {
    keys['arrowleft'] = false;
    keys['arrowright'] = false;
    keys['/'] = false;
    keys['.'] = false;
  }
}

function applyRemoteInput(data) {
  if (!player2) return;
  keys['arrowleft'] = data.keys.left;
  keys['arrowright'] = data.keys.right;
  keys['/'] = data.keys.shoot;
  keys['.'] = data.keys.shield;

  if (data.events) {
    data.events.forEach(event => processRemoteEvent(player2, event));
  }
}

function sendClientInput() {
  if (!conn || !conn.open) return;
  conn.send({
    type: 'input',
    keys: {
      left: isClientKeyPressed('left'),
      right: isClientKeyPressed('right'),
      shoot: isClientKeyPressed('shoot'),
      shield: isClientKeyPressed('shield'),
    },
    events: clientInputState.events.splice(0),
  });
}

function serializePlayer(p) {
  if (!p) return null;
  return {
    x: p.x, y: p.y, vx: p.vx, vy: p.vy,
    facing: p.facing, onGround: p.onGround, jumps: p.jumps,
    health: p.health, maxHealth: p.maxHealth,
    dashing: p.dashing, dashTimer: p.dashTimer, dashCooldown: p.dashCooldown,
    invincible: p.invincible,
    ammo: p.ammo, maxAmmo: p.maxAmmo,
    reloading: p.reloading, reloadTimer: p.reloadTimer,
    weapon: p.weapon,
    shielding: p.shielding,
    shieldEnergy: p.shieldEnergy, maxShieldEnergy: p.maxShieldEnergy,
    alive: p.alive,
    shootCooldown: p.shootCooldown,
    lastHitTimer: p.lastHitTimer,
  };
}

function sendGameState() {
  if (!conn || !conn.open) return;

  conn.send({
    type: 'state',
    p1: serializePlayer(player),
    p2: player2 ? serializePlayer(player2) : null,
    enemies: enemies.map(e => ({
      x: e.x, y: e.y, type: e.type, health: e.health, maxHealth: e.maxHealth,
      facing: e.facing, alive: e.alive, dying: !!e.dying, deathTimer: e.deathTimer || 0,
      deathVx: e.deathVx || 0, deathVy: e.deathVy || 0, deathRotation: e.deathRotation || 0,
      deathRotSpeed: e.deathRotSpeed || 0, vy: e.vy, hit: e.hit,
      speed: e.speed, boss: !!e.boss, bomber: !!e.bomber,
    })),
    bullets: bullets.map(b => ({
      x: b.x, y: b.y, vx: b.vx, vy: b.vy, color: b.color, size: b.size,
      isPlayer: b.isPlayer, life: b.life,
    })),
    powerups: powerups.map(p => ({
      x: p.x, y: p.y, vy: p.vy, w: p.w, h: p.h, type: p.type, color: p.color, life: p.life,
    })),
    state: state,
    score: score,
    level: level,
    wave: wave,
    wavesPerLevel: wavesPerLevel,
    killStreak: killStreak,
    slowMo: slowMo,
    slowMoTimer: slowMoTimer,
    screenShake: screenShake,
    levelIntroTimer: levelIntroTimer,
    levelTransitionTimer: levelTransitionTimer,
    sfx: sfxBuffer.splice(0),
    texts: floatingTextBuffer.splice(0),
  });
}

function applyPlayerState(p, data) {
  p.x = data.x; p.y = data.y;
  p.vx = data.vx; p.vy = data.vy;
  p.facing = data.facing;
  p.onGround = data.onGround;
  p.jumps = data.jumps;
  p.health = data.health; p.maxHealth = data.maxHealth;
  p.dashing = data.dashing;
  p.dashTimer = data.dashTimer;
  p.dashCooldown = data.dashCooldown;
  p.invincible = data.invincible;
  p.ammo = data.ammo; p.maxAmmo = data.maxAmmo;
  p.reloading = data.reloading;
  p.reloadTimer = data.reloadTimer;
  p.weapon = data.weapon;
  p.shielding = data.shielding;
  p.shieldEnergy = data.shieldEnergy;
  p.maxShieldEnergy = data.maxShieldEnergy;
  p.alive = data.alive;
  p.shootCooldown = data.shootCooldown;
  p.lastHitTimer = data.lastHitTimer;
}

function applyHostState(data) {
  if (data.p1) applyPlayerState(player, data.p1);
  if (data.p2) {
    if (!player2) {
      player2 = createPlayer(canvas.width * 2 / 3, { body: '#27ae60', dash: '#f39c12', skin: '#f4d35e', hat: '#1a5c2e', hatBand: '#f39c12', shoe: '#f39c12' });
    }
    applyPlayerState(player2, data.p2);
  }

  enemies = data.enemies.map(e => {
    let def = enemyTypes[e.type];
    return {
      ...def, ...e,
      w: def.w, h: def.h, color: def.color,
      shootTimer: 0, patrolDir: e.facing,
    };
  });

  bullets = data.bullets.map(b => ({ ...b, trail: [], damage: 0 }));
  powerups = data.powerups;

  state = data.state;
  score = data.score;
  if (data.level !== level) {
    level = data.level;
    generatePlatforms();
  }
  wave = data.wave;
  wavesPerLevel = data.wavesPerLevel;
  killStreak = data.killStreak;
  slowMo = data.slowMo;
  slowMoTimer = data.slowMoTimer;
  screenShake = data.screenShake;
  levelIntroTimer = data.levelIntroTimer;
  levelTransitionTimer = data.levelTransitionTimer;

  if (data.sfx) {
    data.sfx.forEach(name => {
      if (SFX[name]) SFX[name]();
    });
  }

  if (data.texts) {
    data.texts.forEach(t => {
      floatingTexts.push({ ...t, maxLife: t.life });
    });
  }
}

function clientUpdate() {
  let dt = slowMo;

  [player, player2].forEach(p => {
    if (!p || !p.alive) return;
    p.vy += GRAVITY * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.y + p.h >= GROUND) {
      p.y = GROUND - p.h;
      p.vy = 0;
      p.onGround = true;
    }

    platforms.forEach(plat => {
      if (p.vy >= 0 &&
          p.x + p.w / 2 > plat.x && p.x - p.w / 2 < plat.x + plat.w &&
          p.y + p.h >= plat.y && p.y + p.h <= plat.y + plat.h + 10) {
        p.y = plat.y - p.h;
        p.vy = 0;
        p.onGround = true;
      }
    });

    p.x = Math.max(p.w / 2, Math.min(canvas.width - p.w / 2, p.x));

    if (p.dashing || Math.abs(p.vx) > 3) {
      p.trail.push({ x: p.x, y: p.y, alpha: 0.5 });
      if (p.trail.length > 8) p.trail.shift();
    } else {
      if (p.trail.length > 0) p.trail.shift();
    }
  });

  enemies.forEach(e => {
    if (!e.alive) return;
    if (e.dying) {
      e.deathTimer -= dt;
      if (e.deathVx) e.x += e.deathVx * dt;
      if (e.deathVy !== undefined) {
        e.deathVy += GRAVITY * dt;
        e.y += e.deathVy * dt;
      }
      if (e.deathRotation !== undefined && e.deathRotSpeed) {
        e.deathRotation += e.deathRotSpeed;
      }
      if (e.y + e.h >= GROUND) { e.y = GROUND - e.h; }
      if (e.deathTimer <= 0) e.alive = false;
      return;
    }
    e.vy += GRAVITY * dt;
    e.y += e.vy * dt;
    if (e.y + e.h >= GROUND) { e.y = GROUND - e.h; e.vy = 0; }
  });

  bullets.forEach(b => {
    b.trail = b.trail || [];
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 6) b.trail.shift();
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
  });
  bullets = bullets.filter(b => b.life > 0 && b.x > -50 && b.x < canvas.width + 50);

  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.1;
    p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);

  casings.forEach(c => {
    if (!c.grounded) {
      c.vy += 0.3;
      c.x += c.vx;
      c.y += c.vy;
      c.rotation += c.vr;
      if (c.y >= GROUND - 2) { c.y = GROUND - 2; c.grounded = true; }
    }
  });
  if (casings.length > 50) casings.splice(0, casings.length - 50);

  floatingTexts.forEach(t => { t.y -= 0.5; t.life--; });
  floatingTexts = floatingTexts.filter(t => t.life > 0);

  if (screenShake > 0) screenShake *= 0.85;
  if (screenShake < 0.5) screenShake = 0;
}

// ─── UPDATE ───
function update() {
  // Handle disconnect countdown
  if (disconnected) {
    disconnectTimer--;
    if (disconnectTimer <= 0) {
      cleanupOnline();
      state = 'menu';
    }
    return;
  }

  // Client uses clientUpdate instead
  if (onlineMode && isClient) {
    clientUpdate();
    return;
  }

  // Handle level intro countdown
  if (state === 'levelIntro') {
    levelIntroTimer--;
    if (levelIntroTimer <= 0) {
      state = 'playing';
    }
    return;
  }
  // Handle level complete countdown
  if (state === 'levelComplete') {
    levelTransitionTimer--;
    if (levelTransitionTimer <= 0) {
      level++;
      startLevel();
    }
    return;
  }
  if (state !== 'playing') return;

  let dt = slowMo;
  if (slowMoTimer > 0) {
    slowMoTimer--;
    slowMo = 0.4;
    if (slowMoTimer <= 0) slowMo = 1;
  } else {
    slowMo = 1;
  }

  // Player movement
  let p1Keys = coopMode ? P1_KEYS_COOP : P1_KEYS;
  updatePlayerMovement(player, p1Keys, dt);
  if (player2) updatePlayerMovement(player2, P2_KEYS, dt);

  // ─── ENEMIES ───
  enemies.forEach(e => {
    if (!e.alive) return;

    // Death animation
    if (e.dying) {
      e.deathTimer -= dt;
      e.x += e.deathVx * dt;
      e.deathVy += GRAVITY * dt;
      e.y += e.deathVy * dt;
      e.deathRotation += e.deathRotSpeed;
      if (e.y + e.h >= GROUND) { e.y = GROUND - e.h; e.deathVy = 0; e.deathVx *= 0.5; }
      if (e.deathTimer <= 0) {
        e.alive = false;
        spawnBlood(e.x, e.y + e.h / 2);
      }
      return;
    }

    if (e.hit > 0) e.hit--;

    // AI Movement
    let target = getClosestLivingPlayer(e.x, e.y);
    let toPlayer = target.x - e.x;
    let dist = Math.abs(toPlayer);

    if (e.type === 'bomber') {
      // Bombers rush toward closest player
      e.facing = toPlayer > 0 ? 1 : -1;
      e.x += e.facing * e.speed * dt;
      let livingPlayers = [player, player2].filter(p => p && p.alive);
      let shouldExplode = livingPlayers.some(p => Math.abs(e.x - p.x) < 30);
      if (shouldExplode) {
        SFX.explosion();
        spawnExplosion(e.x, e.y + e.h / 2, '#ff006e', 30);
        livingPlayers.forEach(p => {
          if (Math.abs(e.x - p.x) < 60) {
            if (p.shielding) {
              SFX.shieldBlock();
              screenShake = 4;
            } else if (p.invincible <= 0) {
              p.health--;
              p.lastHitTimer = 0;
              screenShake = 10;
              checkPlayerDeath(p);
            }
          }
        });
        e.alive = false;
        score += e.score;
        return;
      }
    } else if (e.boss) {
      // Boss AI - aggressive, multi-shot, stomps
      e.facing = toPlayer > 0 ? 1 : -1;
      if (dist > 150) {
        e.x += e.facing * e.speed * dt;
      } else if (dist < 60) {
        e.x -= e.facing * e.speed * 0.3 * dt;
      }
      // Multi-shot burst
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = e.shootRate + Math.random() * 10;
        for (let s = 0; s < 3; s++) {
          setTimeout(() => {
            if (!e.alive || state !== 'playing') return;
            enemyShoot(e);
            screenShake = 3;
          }, s * 80);
        }
      }
      // Boss stomp/jump
      if (!e._jumpTimer) e._jumpTimer = 200;
      e._jumpTimer -= dt;
      if (e._jumpTimer <= 0 && e.y + e.h >= GROUND - 2) {
        e.vy = -10;
        e._jumpTimer = 180 + Math.random() * 120;
        SFX.explosion();
        spawnExplosion(e.x, e.y + e.h, '#ff4444', 8);
      }
    } else {
      // Others patrol and shoot
      if (dist > 200) {
        e.facing = toPlayer > 0 ? 1 : -1;
        e.x += e.facing * e.speed * dt;
      } else if (dist < 80) {
        e.facing = toPlayer > 0 ? 1 : -1;
        e.x -= e.facing * e.speed * 0.5 * dt;
      } else {
        e.facing = toPlayer > 0 ? 1 : -1;
      }

      // Shoot
      e.shootTimer -= dt;
      if (e.shootTimer <= 0 && e.shootRate > 0) {
        e.shootTimer = e.shootRate + Math.random() * 20;
        enemyShoot(e);
      }
    }

    // Gravity
    e.vy += GRAVITY * dt;
    e.y += e.vy * dt;

    if (e.y + e.h >= GROUND) {
      e.y = GROUND - e.h;
      e.vy = 0;
    }

    // Platform collision for enemies
    platforms.forEach(p => {
      if (e.vy >= 0 &&
          e.x + e.w / 2 > p.x && e.x - e.w / 2 < p.x + p.w &&
          e.y + e.h >= p.y && e.y + e.h <= p.y + p.h + 8) {
        e.y = p.y - e.h;
        e.vy = 0;
      }
    });

    // Bounds
    e.x = Math.max(e.w / 2, Math.min(canvas.width - e.w / 2, e.x));
  });

  // ─── BULLETS ───
  bullets.forEach(b => {
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 6) b.trail.shift();

    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    if (b.isPlayer) {
      // Hit enemies
      enemies.forEach(e => {
        if (!e.alive || e.dying) return;
        if (Math.abs(b.x - e.x) < e.w / 2 + b.size && Math.abs(b.y - (e.y + e.h / 2)) < e.h / 2 + b.size) {
          e.health -= b.damage;
          e.hit = 6;
          b.life = 0;
          spawnBlood(b.x, b.y);
          SFX.enemyHit();
          screenShake = Math.max(screenShake, 2);

          if (e.health <= 0 && !e.dying) {
            e.dying = true;
            e.deathTimer = 45;
            e.deathVx = (Math.random() - 0.5) * 3 + (b.vx > 0 ? 2 : -2);
            e.deathVy = -4 - Math.random() * 3;
            e.deathRotation = 0;
            e.deathRotSpeed = (Math.random() - 0.5) * 0.15 + (b.vx > 0 ? 0.08 : -0.08);
            score += e.score;
            killStreak++;
            killStreakTimer = 120;

            if (killStreak >= 3) {
              let mult = Math.min(killStreak, 10);
              let bonus = e.score * (mult - 1);
              score += bonus;
              addFloatingText(`${killStreak}x COMBO! +${bonus}`, e.x, e.y - 20, '#ffe66d', 20, 60);
            }

            SFX.enemyDeath();
            spawnExplosion(e.x, e.y + e.h / 2, e.color);
            addFloatingText(`+${e.score}`, e.x, e.y, '#fff', 14, 40);
          }
        }
      });
    } else {
      // Hit players - check all living players
      let livingPlayers = [player, player2].filter(p => p && p.alive);
      for (let p of livingPlayers) {
        if (p.invincible <= 0 &&
            Math.abs(b.x - p.x) < p.w / 2 + b.size &&
            Math.abs(b.y - (p.y + p.h / 2)) < p.h / 2 + b.size) {
          if (p.shielding) {
            b.life = 0;
            SFX.shieldBlock();
            screenShake = 2;
            for (let i = 0; i < 5; i++) {
              particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 10, maxLife: 10, color: '#66bbff', size: 3 });
            }
          } else {
            p.health--;
            p.lastHitTimer = 0;
            b.life = 0;
            screenShake = 6;
            p.invincible = 30;
            SFX.playerHit();
            spawnBlood(p.x, p.y + p.h / 2);
            addFloatingText('-1', p.x, p.y, '#ff6b6b', 20, 40);
            checkPlayerDeath(p);
          }
          break;
        }
      }
    }
  });

  // Clean up
  bullets = bullets.filter(b => b.life > 0 && b.x > -50 && b.x < canvas.width + 50 && b.y > -50 && b.y < canvas.height + 50);
  enemies = enemies.filter(e => e.alive);

  // ─── POWERUPS ───
  powerups.forEach(pu => {
    pu.vy += 0.15;
    pu.y += pu.vy;
    pu.life--;

    // Ground
    if (pu.y + pu.h >= GROUND) { pu.y = GROUND - pu.h; pu.vy = 0; }

    // Platform
    platforms.forEach(plat => {
      if (pu.vy >= 0 && pu.x + pu.w / 2 > plat.x && pu.x - pu.w / 2 < plat.x + plat.w &&
          pu.y + pu.h >= plat.y && pu.y + pu.h <= plat.y + plat.h + 8) {
        pu.y = plat.y - pu.h; pu.vy = 0;
      }
    });

    // Pickup - check both players
    let livingPlayers = [player, player2].filter(p => p && p.alive);
    for (let p of livingPlayers) {
      if (Math.abs(pu.x - p.x) < 25 && Math.abs(pu.y - (p.y + p.h / 2)) < 30) {
        SFX.pickup();
        pu.life = 0;
        spawnExplosion(pu.x, pu.y, pu.color, 10);
        if (pu.type === 'health') {
          p.health = Math.min(p.maxHealth, p.health + 2);
          addFloatingText('+2 HP', pu.x, pu.y - 10, '#ff6b6b', 18, 50);
        } else if (pu.type === 'slowmo') {
          slowMoTimer = 180;
          addFloatingText('SLOW-MO!', pu.x, pu.y - 10, '#c77dff', 18, 50);
        } else {
          p.weapon = pu.type;
          p.ammo = weapons[pu.type].ammo;
          p.maxAmmo = weapons[pu.type].ammo;
          p.reloading = false;
          addFloatingText(weapons[pu.type].name.toUpperCase() + '!', pu.x, pu.y - 10, pu.color, 18, 50);
        }
        break;
      }
    }
  });
  powerups = powerups.filter(pu => pu.life > 0);

  // ─── PARTICLES ───
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.1;
    p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);

  // Casings
  casings.forEach(c => {
    if (!c.grounded) {
      c.vy += 0.3;
      c.x += c.vx;
      c.y += c.vy;
      c.rotation += c.vr;
      if (c.y >= GROUND - 2) { c.y = GROUND - 2; c.grounded = true; }
    }
  });
  if (casings.length > 50) casings.splice(0, casings.length - 50);

  // Floating texts
  floatingTexts.forEach(t => { t.y -= 0.5; t.life--; });
  floatingTexts = floatingTexts.filter(t => t.life > 0);

  // Kill streak decay
  if (killStreakTimer > 0) killStreakTimer--;
  else killStreak = 0;

  // Screen shake decay
  if (screenShake > 0) screenShake *= 0.85;
  if (screenShake < 0.5) screenShake = 0;

  // Wave management
  waveTimer -= dt;
  if (enemies.length === 0 && waveTimer <= 0) {
    spawnWave();
  }

}

// ─── BACKDROP ───
function drawBackdrop(type) {
  let lvl = getCurrentLevel();
  let time = Date.now() * 0.001;

  if (type === 'city') {
    // Tall building silhouettes
    let buildings = [
      { x: 30, w: 60, h: 200 }, { x: 120, w: 45, h: 260 },
      { x: 200, w: 70, h: 180 }, { x: 310, w: 55, h: 300 },
      { x: 400, w: 80, h: 220 }, { x: 520, w: 50, h: 280 },
      { x: 600, w: 65, h: 190 }, { x: 700, w: 75, h: 310 },
      { x: 800, w: 55, h: 240 },
    ];
    buildings.forEach(b => {
      let by = GROUND - b.h;
      ctx.fillStyle = 'rgba(10,10,30,0.6)';
      ctx.fillRect(b.x, by, b.w, b.h);
      // Lit windows
      for (let wy = by + 15; wy < GROUND - 20; wy += 22) {
        for (let wx = b.x + 8; wx < b.x + b.w - 8; wx += 14) {
          let on = Math.sin(wx * 3.7 + wy * 2.1 + time * 0.3) > 0.2;
          if (on) {
            ctx.fillStyle = 'rgba(255,230,100,0.25)';
            ctx.fillRect(wx, wy, 6, 8);
          }
        }
      }
    });
    // Neon signs
    ctx.globalAlpha = 0.3 + Math.sin(time * 2) * 0.15;
    ctx.fillStyle = lvl.groundLine;
    ctx.fillRect(135, GROUND - 230, 20, 6);
    ctx.fillRect(530, GROUND - 250, 25, 6);
    ctx.globalAlpha = 1;

  } else if (type === 'rooftops') {
    // Low building outlines
    let roofs = [
      { x: 0, w: 140, h: 80 }, { x: 180, w: 100, h: 50 },
      { x: 320, w: 160, h: 70 }, { x: 530, w: 120, h: 90 },
      { x: 690, w: 100, h: 55 }, { x: 820, w: 80, h: 75 },
    ];
    roofs.forEach(r => {
      let ry = GROUND - r.h;
      ctx.fillStyle = 'rgba(20,10,30,0.5)';
      ctx.fillRect(r.x, ry, r.w, r.h);
      // Rooftop edge
      ctx.fillStyle = 'rgba(40,20,50,0.4)';
      ctx.fillRect(r.x, ry, r.w, 4);
    });
    // Antennas
    ctx.strokeStyle = 'rgba(100,60,120,0.4)';
    ctx.lineWidth = 2;
    [[70, GROUND - 80, 45], [350, GROUND - 70, 35], [560, GROUND - 90, 50]].forEach(([ax, ay, ah]) => {
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax, ay - ah); ctx.stroke();
      ctx.fillStyle = 'rgba(255,80,80,0.5)';
      ctx.beginPath(); ctx.arc(ax, ay - ah, 2, 0, Math.PI * 2); ctx.fill();
    });
    // Water towers
    ctx.fillStyle = 'rgba(30,15,40,0.5)';
    ctx.fillRect(740, GROUND - 100, 24, 20);
    ctx.fillRect(736, GROUND - 105, 32, 8);
    // Legs
    ctx.strokeStyle = 'rgba(30,15,40,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(740, GROUND - 80); ctx.lineTo(738, GROUND - 55); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(764, GROUND - 80); ctx.lineTo(766, GROUND - 55); ctx.stroke();

  } else if (type === 'warehouse') {
    // Large rectangular structures
    ctx.fillStyle = 'rgba(15,25,15,0.5)';
    ctx.fillRect(50, GROUND - 150, 200, 150);
    ctx.fillRect(650, GROUND - 130, 200, 130);
    // Corrugated walls
    ctx.strokeStyle = 'rgba(30,50,30,0.3)';
    ctx.lineWidth = 1;
    for (let wx = 55; wx < 245; wx += 12) {
      ctx.beginPath(); ctx.moveTo(wx, GROUND - 145); ctx.lineTo(wx, GROUND); ctx.stroke();
    }
    for (let wx = 655; wx < 845; wx += 12) {
      ctx.beginPath(); ctx.moveTo(wx, GROUND - 125); ctx.lineTo(wx, GROUND); ctx.stroke();
    }
    // Pipes
    ctx.strokeStyle = 'rgba(60,100,60,0.35)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(250, GROUND - 120); ctx.lineTo(350, GROUND - 120);
    ctx.lineTo(350, GROUND - 40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(550, GROUND - 100); ctx.lineTo(650, GROUND - 100); ctx.stroke();
    // Roof slope
    ctx.fillStyle = 'rgba(20,35,20,0.4)';
    ctx.beginPath();
    ctx.moveTo(50, GROUND - 150); ctx.lineTo(150, GROUND - 170);
    ctx.lineTo(250, GROUND - 150); ctx.closePath(); ctx.fill();

  } else if (type === 'docks') {
    // Cranes
    ctx.strokeStyle = 'rgba(40,50,80,0.45)';
    ctx.lineWidth = 4;
    // Left crane
    ctx.beginPath(); ctx.moveTo(100, GROUND); ctx.lineTo(100, GROUND - 250); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100, GROUND - 250); ctx.lineTo(200, GROUND - 250); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(200, GROUND - 250); ctx.lineTo(200, GROUND - 180); ctx.stroke();
    // Right crane
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(750, GROUND); ctx.lineTo(750, GROUND - 220); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(750, GROUND - 220); ctx.lineTo(650, GROUND - 220); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(650, GROUND - 220); ctx.lineTo(650, GROUND - 160); ctx.stroke();
    // Shipping containers
    let containers = [
      { x: 300, w: 60, h: 30, c: 'rgba(80,30,30,0.4)' },
      { x: 360, w: 60, h: 30, c: 'rgba(30,30,80,0.4)' },
      { x: 330, w: 60, h: 30, c: 'rgba(30,70,30,0.4)', stack: true },
      { x: 500, w: 60, h: 30, c: 'rgba(80,60,20,0.4)' },
    ];
    containers.forEach(c => {
      let cy = c.stack ? GROUND - 60 : GROUND - 30;
      ctx.fillStyle = c.c;
      ctx.fillRect(c.x, cy, c.w, c.h);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      ctx.strokeRect(c.x, cy, c.w, c.h);
    });
    // Water reflections at ground level
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = lvl.groundLine;
    for (let wx = 0; wx < canvas.width; wx += 30) {
      let rw = 10 + Math.sin(wx * 0.5 + time) * 5;
      ctx.fillRect(wx, GROUND + 5, rw, 2);
    }
    ctx.globalAlpha = 1;

  } else if (type === 'ruins') {
    // Broken buildings
    ctx.fillStyle = 'rgba(30,10,10,0.5)';
    // Left ruin - jagged top
    ctx.beginPath();
    ctx.moveTo(40, GROUND); ctx.lineTo(40, GROUND - 160);
    ctx.lineTo(60, GROUND - 180); ctx.lineTo(80, GROUND - 140);
    ctx.lineTo(100, GROUND - 170); ctx.lineTo(120, GROUND - 120);
    ctx.lineTo(140, GROUND); ctx.closePath(); ctx.fill();
    // Center ruin
    ctx.beginPath();
    ctx.moveTo(380, GROUND); ctx.lineTo(380, GROUND - 130);
    ctx.lineTo(400, GROUND - 150); ctx.lineTo(420, GROUND - 100);
    ctx.lineTo(450, GROUND - 140); ctx.lineTo(470, GROUND - 90);
    ctx.lineTo(500, GROUND - 110); ctx.lineTo(520, GROUND);
    ctx.closePath(); ctx.fill();
    // Right ruin
    ctx.beginPath();
    ctx.moveTo(720, GROUND); ctx.lineTo(720, GROUND - 190);
    ctx.lineTo(750, GROUND - 160); ctx.lineTo(770, GROUND - 200);
    ctx.lineTo(800, GROUND - 150); ctx.lineTo(830, GROUND - 180);
    ctx.lineTo(850, GROUND); ctx.closePath(); ctx.fill();
    // Rubble piles
    ctx.fillStyle = 'rgba(40,15,15,0.4)';
    [[200, 30], [550, 25], [680, 20]].forEach(([rx, rh]) => {
      ctx.beginPath();
      ctx.moveTo(rx - 30, GROUND); ctx.quadraticCurveTo(rx, GROUND - rh, rx + 30, GROUND);
      ctx.fill();
    });
    // Smoke wisps
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#aaa';
    [90, 450, 780].forEach(sx => {
      let sy = GROUND - 140 + Math.sin(sx) * 30;
      for (let i = 0; i < 3; i++) {
        let offset = Math.sin(time + i * 2 + sx) * 15;
        ctx.beginPath();
        ctx.arc(sx + offset, sy - i * 20, 8 + i * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
  }
}

// ─── DRAW PLAYER ───
function drawPlayer(p) {
  if (!p || !p.alive) return;

  // Trail
  p.trail.forEach((t, i) => {
    let alpha = (i / p.trail.length) * 0.3;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.dashing ? p.dashColor : p.bodyColor;
    ctx.fillRect(t.x - p.w / 2, t.y, p.w, p.h);
  });
  ctx.globalAlpha = 1;

  // Invincibility flash
  if (p.invincible > 0 && Math.floor(p.invincible / 3) % 2 === 0) {
    ctx.globalAlpha = 0.5;
  }

  ctx.save();
  ctx.translate(p.x, p.y);

  let walkCycle = (p.onGround && Math.abs(p.vx) > 0.5) ? Math.sin(Date.now() * 0.012) : 0;
  let bodyColor = p.dashing ? p.dashColor : p.bodyColor;
  let skinColor = p.skinColor;

  // Legs
  let legSpread = walkCycle * 6;
  let legBottom = p.h - 4;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = p.hatColor;
  ctx.beginPath();
  ctx.moveTo(-4, 28);
  ctx.lineTo(-6 - legSpread, legBottom);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(4, 28);
  ctx.lineTo(6 + legSpread, legBottom);
  ctx.stroke();
  // Shoes
  ctx.fillStyle = p.shoeColor;
  ctx.beginPath();
  ctx.ellipse(-6 - legSpread, legBottom, 5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(6 + legSpread, legBottom, 5, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Torso
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(-10, 14);
  ctx.lineTo(-11, 28);
  ctx.lineTo(11, 28);
  ctx.lineTo(10, 14);
  ctx.closePath();
  ctx.fill();
  // Belt
  ctx.fillStyle = '#7f8c8d';
  ctx.fillRect(-10, 26, 20, 3);
  ctx.fillStyle = '#f1c40f';
  ctx.fillRect(-2, 26, 4, 3);

  // Back arm
  ctx.strokeStyle = skinColor;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  let backArmSwing = walkCycle * 4;
  ctx.beginPath();
  ctx.moveTo(-p.facing * 6, 17);
  ctx.lineTo(-p.facing * 10, 26 + backArmSwing);
  ctx.stroke();

  // Gun arm
  let gunArmY = 18;
  ctx.strokeStyle = skinColor;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(p.facing * 6, 17);
  ctx.lineTo(p.facing * 13, gunArmY);
  ctx.stroke();

  // Gun
  ctx.fillStyle = '#7f8c8d';
  ctx.save();
  ctx.translate(p.facing * 13, gunArmY);
  ctx.fillStyle = '#95a5a6';
  ctx.fillRect(0, -3, p.facing * 16, 5);
  ctx.fillStyle = '#5d4e37';
  ctx.fillRect(0, 2, p.facing * 4, 5);
  ctx.fillStyle = '#bdc3c7';
  ctx.fillRect(p.facing * 14, -2, p.facing * 3, 3);
  ctx.restore();

  // Head
  ctx.fillStyle = skinColor;
  ctx.beginPath();
  ctx.arc(0, 8, 10, 0, Math.PI * 2);
  ctx.fill();

  // Hat
  ctx.fillStyle = p.hatColor;
  ctx.fillRect(-13, 1, 26, 4);
  ctx.beginPath();
  ctx.moveTo(-9, 4);
  ctx.lineTo(-8, -6);
  ctx.lineTo(8, -6);
  ctx.lineTo(9, 4);
  ctx.closePath();
  ctx.fill();
  // Hat band
  ctx.fillStyle = p.hatBand;
  ctx.fillRect(-9, 0, 18, 3);

  // Face
  ctx.fillStyle = '#fff';
  let eyeX = p.facing > 0 ? 3 : -6;
  ctx.beginPath();
  ctx.ellipse(eyeX, 7, 3, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(eyeX + p.facing * 1, 7, 1.5, 0, Math.PI * 2);
  ctx.fill();
  // Mouth
  ctx.strokeStyle = '#c0392b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(p.facing * 3, 12, 3, 0.1, Math.PI * 0.8);
  ctx.stroke();

  // Shield
  if (p.shielding) {
    let shieldPulse = 0.25 + Math.sin(Date.now() * 0.008) * 0.1;
    ctx.globalAlpha = shieldPulse;
    ctx.strokeStyle = '#66bbff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#66bbff';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(0, p.h / 2, p.w * 0.9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // Health bar
  let hpRatio = p.health / p.maxHealth;
  ctx.fillStyle = 'rgba(50,50,50,0.5)';
  ctx.fillRect(-p.w / 2, p.h + 4, p.w, 4);
  ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.25 ? '#f39c12' : '#e74c3c';
  ctx.fillRect(-p.w / 2, p.h + 4, p.w * hpRatio, 4);

  // Reload indicator
  if (p.reloading) {
    ctx.fillStyle = 'rgba(243,156,18,0.3)';
    ctx.fillRect(-p.w / 2, p.h + 10, p.w * (1 - p.reloadTimer / 50), 3);
  } else {
    let ammoRatio = p.ammo / p.maxAmmo;
    ctx.fillStyle = ammoRatio > 0.3 ? '#ffe66d' : '#e74c3c';
    ctx.fillRect(-p.w / 2, p.h + 10, p.w * ammoRatio, 3);
  }

  // Shield energy bar
  let shieldRatio = p.shieldEnergy / p.maxShieldEnergy;
  ctx.fillStyle = 'rgba(50,50,80,0.5)';
  ctx.fillRect(-p.w / 2, p.h + 15, p.w, 3);
  ctx.fillStyle = shieldRatio > 0.3 ? '#66bbff' : '#ff6666';
  ctx.fillRect(-p.w / 2, p.h + 15, p.w * shieldRatio, 3);

  ctx.restore();
  ctx.globalAlpha = 1;
}

// ─── DRAW ───
function draw() {
  ctx.save();

  // Screen shake
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake * 2, (Math.random() - 0.5) * screenShake * 2);
  }

  // Level theme
  let lvl = getCurrentLevel();

  // Sky gradient
  let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, lvl.sky[0]);
  grad.addColorStop(0.6, lvl.sky[1]);
  grad.addColorStop(1, lvl.sky[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  let time = Date.now() * 0.002;
  stars.forEach(s => {
    let alpha = 0.3 + Math.sin(time + s.twinkle) * 0.3;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  // Backdrop
  drawBackdrop(lvl.backdrop);

  // Ground
  let groundGrad = ctx.createLinearGradient(0, GROUND, 0, canvas.height);
  groundGrad.addColorStop(0, lvl.ground[0]);
  groundGrad.addColorStop(0.3, lvl.ground[1]);
  groundGrad.addColorStop(1, lvl.ground[2]);
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, GROUND, canvas.width, canvas.height - GROUND);
  // Ground surface line with glow
  ctx.shadowColor = lvl.groundGlow;
  ctx.shadowBlur = 6;
  ctx.strokeStyle = lvl.groundLine;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(canvas.width, GROUND);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // Ground texture - small dashes
  ctx.strokeStyle = lvl.groundLine.replace(')', ',0.2)').replace('rgb', 'rgba').replace('#', '');
  ctx.globalAlpha = 0.2;
  ctx.strokeStyle = lvl.groundLine;
  ctx.lineWidth = 1;
  for (let gx = 0; gx < canvas.width; gx += 18) {
    let gy = GROUND + 8 + (gx * 7 % 13);
    ctx.beginPath();
    ctx.moveTo(gx, gy);
    ctx.lineTo(gx + 6 + (gx % 5), gy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Ground edge highlight dots
  for (let gx = 0; gx < canvas.width; gx += 40) {
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = lvl.groundLine;
    ctx.beginPath();
    ctx.arc(gx + 20, GROUND + 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Platforms
  platforms.forEach(p => {
    // Platform body with gradient
    let platGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    platGrad.addColorStop(0, '#3a3a6a');
    platGrad.addColorStop(1, '#2a2a4a');
    ctx.fillStyle = platGrad;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, 3);
    ctx.fill();
    // Top surface glow
    ctx.shadowColor = '#6a6aff';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = '#7a7abb';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x + 3, p.y);
    ctx.lineTo(p.x + p.w - 3, p.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Support brackets
    ctx.fillStyle = '#222244';
    ctx.fillRect(p.x + 8, p.y + p.h, 4, 8);
    ctx.fillRect(p.x + p.w - 12, p.y + p.h, 4, 8);
  });

  // Casings
  ctx.fillStyle = '#b8860b';
  casings.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rotation);
    ctx.fillRect(-3, -1, 6, 2);
    ctx.restore();
  });

  // Particles
  particles.forEach(p => {
    let alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // Bullets
  bullets.forEach(b => {
    // Trail
    b.trail.forEach((t, i) => {
      let alpha = (i / b.trail.length) * 0.4;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    // Bullet glow
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // Powerups
  powerups.forEach(p => {
    let bob = Math.sin(Date.now() * 0.005) * 3;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2 + bob, p.w, p.h);
    ctx.shadowBlur = 0;
    // Icon
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    let icon = p.type === 'health' ? '+' : p.type === 'slowmo' ? 'S' : p.type[0].toUpperCase();
    ctx.fillText(icon, p.x, p.y + 4 + bob);
  });

  // Enemies
  enemies.forEach(e => {
    if (!e.alive) return;
    let shake = e.hit > 0 ? (Math.random() - 0.5) * 4 : 0;
    let eColor = e.hit > 0 ? '#fff' : e.color;
    let eSkin = e.hit > 0 ? '#fff' : '#cba984';
    let eWalk = Math.sin(Date.now() * 0.01 + e.x) * 5;

    ctx.save();
    if (e.dying) {
      let alpha = Math.max(0, e.deathTimer / 45);
      ctx.globalAlpha = alpha;
      ctx.translate(e.x, e.y + e.h / 2);
      ctx.rotate(e.deathRotation);
      ctx.translate(0, -e.h / 2);
      eColor = e.color;
      eSkin = '#cba984';
    } else {
      ctx.translate(e.x + shake, e.y);
    }

    if (e.boss) {
      // ── BOSS RENDERING ──
      let bossTime = Date.now() * 0.003;

      // Pulsing aura
      let auraPulse = 0.15 + Math.sin(bossTime) * 0.1;
      ctx.globalAlpha = auraPulse;
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#ff0000';
      ctx.beginPath();
      ctx.arc(0, e.h * 0.4, e.w * 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

      // Legs (thicker)
      let eLegBottom = e.h - 3;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#222';
      ctx.beginPath();
      ctx.moveTo(-6, e.h * 0.62);
      ctx.lineTo(-8 - eWalk, eLegBottom);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(6, e.h * 0.62);
      ctx.lineTo(8 + eWalk, eLegBottom);
      ctx.stroke();
      // Heavy boots
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.ellipse(-8 - eWalk, eLegBottom, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(8 + eWalk, eLegBottom, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Torso (wider)
      ctx.fillStyle = eColor;
      let tw = e.w * 0.85;
      ctx.beginPath();
      ctx.moveTo(-tw / 2, e.h * 0.24);
      ctx.lineTo(-tw / 2 - 3, e.h * 0.62);
      ctx.lineTo(tw / 2 + 3, e.h * 0.62);
      ctx.lineTo(tw / 2, e.h * 0.24);
      ctx.closePath();
      ctx.fill();
      // Chest armor detail
      ctx.strokeStyle = 'rgba(255,100,100,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-8, e.h * 0.32);
      ctx.lineTo(0, e.h * 0.42);
      ctx.lineTo(8, e.h * 0.32);
      ctx.stroke();

      // Arms (thicker)
      ctx.strokeStyle = eSkin;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-e.facing * 8, e.h * 0.3);
      ctx.lineTo(-e.facing * 14, e.h * 0.5 + eWalk * 0.5);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.facing * 8, e.h * 0.3);
      ctx.lineTo(e.facing * 16, e.h * 0.36);
      ctx.stroke();

      // Big gun
      ctx.fillStyle = '#555';
      ctx.fillRect(e.facing * 16, e.h * 0.33 - 3, e.facing * 18, 5);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(e.facing * 16, e.h * 0.33 - 4, e.facing * 3, 7);

      // Head (larger)
      ctx.fillStyle = eSkin;
      let headR = e.w * 0.34;
      ctx.beginPath();
      ctx.arc(0, e.h * 0.16, headR, 0, Math.PI * 2);
      ctx.fill();

      // Crown/Horns
      ctx.fillStyle = '#cc0000';
      // Left horn
      ctx.beginPath();
      ctx.moveTo(-headR + 2, e.h * 0.1);
      ctx.lineTo(-headR - 4, e.h * 0.16 - headR - 14);
      ctx.lineTo(-headR + 8, e.h * 0.06);
      ctx.closePath();
      ctx.fill();
      // Right horn
      ctx.beginPath();
      ctx.moveTo(headR - 2, e.h * 0.1);
      ctx.lineTo(headR + 4, e.h * 0.16 - headR - 14);
      ctx.lineTo(headR - 8, e.h * 0.06);
      ctx.closePath();
      ctx.fill();
      // Center spike
      ctx.beginPath();
      ctx.moveTo(-4, e.h * 0.05);
      ctx.lineTo(0, e.h * 0.16 - headR - 10);
      ctx.lineTo(4, e.h * 0.05);
      ctx.closePath();
      ctx.fill();

      // Glowing red eyes
      let eyeGlow = 0.7 + Math.sin(bossTime * 2) * 0.3;
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 12;
      ctx.fillStyle = `rgba(255,0,0,${eyeGlow})`;
      let eeXL = -5;
      let eeXR = 5;
      let eeY = e.h * 0.15;
      ctx.beginPath();
      ctx.ellipse(eeXL, eeY, 3, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(eeXR, eeY, 3, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Eye glint
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(eeXL + e.facing, eeY - 1, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eeXR + e.facing, eeY - 1, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Angry brow
      ctx.strokeStyle = '#660000';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(eeXL - 4, eeY - 5);
      ctx.lineTo(eeXL + 4, eeY - 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(eeXR + 4, eeY - 5);
      ctx.lineTo(eeXR - 4, eeY - 3);
      ctx.stroke();

      // Big health bar
      let hbW = 60;
      let hbH = 7;
      ctx.fillStyle = '#333';
      ctx.fillRect(-hbW / 2, -18, hbW, hbH);
      let hpRatio = e.health / e.maxHealth;
      let hpColor = hpRatio > 0.5 ? '#ff0000' : hpRatio > 0.25 ? '#ff6600' : '#ff0000';
      ctx.fillStyle = hpColor;
      ctx.fillRect(-hbW / 2, -18, hbW * hpRatio, hbH);
      ctx.strokeStyle = '#aa0000';
      ctx.lineWidth = 1;
      ctx.strokeRect(-hbW / 2, -18, hbW, hbH);
      // "BOSS" label
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', 0, -21);

    } else {
      // ── NORMAL ENEMY RENDERING ──

      // ── Legs ──
      let eLegBottom = e.h - 3;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#333';
      ctx.beginPath();
      ctx.moveTo(-3, e.h * 0.62);
      ctx.lineTo(-5 - eWalk, eLegBottom);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(3, e.h * 0.62);
      ctx.lineTo(5 + eWalk, eLegBottom);
      ctx.stroke();
      // Shoes
      ctx.fillStyle = '#444';
      ctx.beginPath();
      ctx.ellipse(-5 - eWalk, eLegBottom, 4, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(5 + eWalk, eLegBottom, 4, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // ── Torso ──
      ctx.fillStyle = eColor;
      let tw = e.w * 0.8;
      ctx.beginPath();
      ctx.moveTo(-tw / 2, e.h * 0.28);
      ctx.lineTo(-tw / 2 - 1, e.h * 0.62);
      ctx.lineTo(tw / 2 + 1, e.h * 0.62);
      ctx.lineTo(tw / 2, e.h * 0.28);
      ctx.closePath();
      ctx.fill();

      // ── Arms ──
      ctx.strokeStyle = eSkin;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      // Back arm
      ctx.beginPath();
      ctx.moveTo(-e.facing * 5, e.h * 0.32);
      ctx.lineTo(-e.facing * 9, e.h * 0.5 + eWalk * 0.5);
      ctx.stroke();
      // Gun arm
      ctx.beginPath();
      ctx.moveTo(e.facing * 5, e.h * 0.32);
      ctx.lineTo(e.facing * 11, e.h * 0.38);
      ctx.stroke();

      // ── Gun ──
      if (!e.bomber) {
        ctx.fillStyle = '#666';
        ctx.fillRect(e.facing * 11, e.h * 0.36 - 2, e.facing * 12, 3);
      }

      // ── Head ──
      ctx.fillStyle = eSkin;
      let headR = e.w * 0.32;
      ctx.beginPath();
      ctx.arc(0, e.h * 0.2, headR, 0, Math.PI * 2);
      ctx.fill();

      // ── Bandana/headgear ──
      ctx.fillStyle = eColor;
      ctx.beginPath();
      ctx.arc(0, e.h * 0.2 - 2, headR, Math.PI, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      let eeX = e.facing > 0 ? 2 : -5;
      ctx.beginPath();
      ctx.ellipse(eeX, e.h * 0.19, 2.5, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(eeX + e.facing, e.h * 0.19, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Angry eyebrow
      ctx.strokeStyle = eColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(eeX - 3, e.h * 0.14 + (e.facing > 0 ? 2 : 0));
      ctx.lineTo(eeX + 3, e.h * 0.14 + (e.facing > 0 ? 0 : 2));
      ctx.stroke();

      // Health bar
      if (e.health < e.maxHealth) {
        ctx.fillStyle = '#333';
        ctx.fillRect(-e.w / 2, -12, e.w, 4);
        ctx.fillStyle = e.color;
        ctx.fillRect(-e.w / 2, -12, e.w * (e.health / e.maxHealth), 4);
      }

      // Bomber warning - blinking vest
      if (e.bomber) {
        let blink = Math.sin(Date.now() * 0.015) > 0;
        ctx.fillStyle = blink ? '#ff006e' : '#aa0044';
        ctx.fillRect(-tw / 2 + 2, e.h * 0.35, tw - 4, 8);
        if (blink) {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(0, e.h * 0.39, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    ctx.restore();
  });

  // Players
  if (state === 'playing') {
    drawPlayer(player);
    if (player2) drawPlayer(player2);

    // P1/P2 labels in co-op
    if (coopMode) {
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      if (player.alive) {
        ctx.fillStyle = player.bodyColor;
        ctx.fillText('P1', player.x, player.y - 10);
      }
      if (player2 && player2.alive) {
        ctx.fillStyle = player2.bodyColor;
        ctx.fillText('P2', player2.x, player2.y - 10);
      }
    }
  }

  // Floating texts
  floatingTexts.forEach(t => {
    let alpha = t.life / t.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.color;
    ctx.font = `bold ${t.size}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
  });
  ctx.globalAlpha = 1;

  // ─── HUD ───
  // P1 Health
  let hudBarW = coopMode ? 130 : 150;
  ctx.fillStyle = '#333';
  ctx.fillRect(20, 15, hudBarW, 14);
  let p1hp = player.alive ? player.health : 0;
  ctx.fillStyle = p1hp > 2 ? '#2ecc71' : p1hp > 1 ? '#f39c12' : '#e74c3c';
  ctx.fillRect(20, 15, hudBarW * (p1hp / player.maxHealth), 14);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, 15, hudBarW, 14);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(coopMode ? `P1 ${p1hp}/${player.maxHealth}` : `HP ${p1hp}/${player.maxHealth}`, 20 + hudBarW / 2, 26);
  // P1 Regen indicator
  if (player.alive && player.lastHitTimer > 240 && player.health < player.maxHealth) {
    ctx.fillStyle = '#2ecc71';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('+ REGEN', 20 + hudBarW + 5, 26);
  }

  // P1 Shield energy bar
  ctx.fillStyle = '#333';
  ctx.fillRect(20, 32, hudBarW, 8);
  let hudShieldRatio = player.shieldEnergy / player.maxShieldEnergy;
  ctx.fillStyle = hudShieldRatio > 0.3 ? '#66bbff' : '#ff6666';
  ctx.fillRect(20, 32, hudBarW * hudShieldRatio, 8);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, 32, hudBarW, 8);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 7px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SHIELD', 20 + hudBarW / 2, 39);

  // P1 Ammo
  ctx.textAlign = 'left';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = player.reloading ? '#f39c12' : '#fff';
  let ammoText = player.reloading ? `[RELOADING...]` : `${weapons[player.weapon].name}: ${player.ammo}/${player.maxAmmo}`;
  ctx.fillText(ammoText, 20, 55);

  // P1 dead indicator
  if (coopMode && !player.alive) {
    ctx.fillStyle = 'rgba(233,69,96,0.7)';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('DEAD', 20, 70);
  }

  // P2 HUD (co-op only)
  if (coopMode && player2) {
    let p2x = canvas.width - 20 - hudBarW;
    // P2 Health
    ctx.fillStyle = '#333';
    ctx.fillRect(p2x, 15, hudBarW, 14);
    let p2hp = player2.alive ? player2.health : 0;
    ctx.fillStyle = p2hp > 2 ? '#2ecc71' : p2hp > 1 ? '#f39c12' : '#e74c3c';
    ctx.fillRect(p2x, 15, hudBarW * (p2hp / player2.maxHealth), 14);
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.strokeRect(p2x, 15, hudBarW, 14);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`P2 ${p2hp}/${player2.maxHealth}`, p2x + hudBarW / 2, 26);
    // P2 Shield
    ctx.fillStyle = '#333';
    ctx.fillRect(p2x, 32, hudBarW, 8);
    let p2ShieldRatio = player2.shieldEnergy / player2.maxShieldEnergy;
    ctx.fillStyle = p2ShieldRatio > 0.3 ? '#66bbff' : '#ff6666';
    ctx.fillRect(p2x, 32, hudBarW * p2ShieldRatio, 8);
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.strokeRect(p2x, 32, hudBarW, 8);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SHIELD', p2x + hudBarW / 2, 39);
    // P2 Ammo
    ctx.textAlign = 'right';
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = player2.reloading ? '#f39c12' : '#fff';
    let p2AmmoText = player2.reloading ? `[RELOADING...]` : `${weapons[player2.weapon].name}: ${player2.ammo}/${player2.maxAmmo}`;
    ctx.fillText(p2AmmoText, canvas.width - 20, 55);
    // P2 dead indicator
    if (!player2.alive) {
      ctx.fillStyle = 'rgba(233,69,96,0.7)';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('DEAD', canvas.width - 20, 70);
    }
  }

  // Score
  if (coopMode) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#ffe66d';
    ctx.fillText(`${score}`, canvas.width / 2, 80);
    ctx.font = '10px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText(`BEST: ${highScore}`, canvas.width / 2, 92);
  } else {
    ctx.textAlign = 'right';
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#ffe66d';
    ctx.fillText(`${score}`, canvas.width - 20, 30);
    ctx.font = '12px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText(`BEST: ${highScore}`, canvas.width - 20, 48);
  }

  // Wave
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#888';
  ctx.fillText(`LVL ${level} - WAVE ${wave}/${wavesPerLevel}`, canvas.width / 2, 28);

  // Kill streak
  if (killStreak >= 3) {
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`${killStreak}x STREAK`, canvas.width / 2, 48);
  }

  // Slow-mo indicator
  if (slowMoTimer > 0) {
    ctx.fillStyle = '#c77dff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SLOW-MO: ${Math.ceil(slowMoTimer / 60)}s`, 20, coopMode ? 85 : 68);
  }

  // Mute button (bottom-right)
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.roundRect(MUTE_BTN.x, MUTE_BTN.y, MUTE_BTN.w, MUTE_BTN.h, 4);
  ctx.fill();
  ctx.fillStyle = muted ? '#e94560' : '#fff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  if (muted) {
    ctx.fillText('\\', MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + 16);
    ctx.fillStyle = 'rgba(233,69,96,0.5)';
    ctx.font = '10px monospace';
    ctx.fillText('OFF', MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + MUTE_BTN.h + 10);
  } else {
    ctx.fillText(')))', MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + 16);
  }

  ctx.restore();

  // ─── MENUS ───
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('GUNSLINGER', canvas.width / 2, 100);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('ARENA', canvas.width / 2, 130);

    // Mode selection
    ctx.font = 'bold 20px monospace';
    let modes = ['1 PLAYER', 'LOCAL CO-OP', 'ONLINE CO-OP'];
    modes.forEach((mode, i) => {
      let my = 170 + i * 32;
      if (i === menuSelection) {
        ctx.fillStyle = '#ffe66d';
        ctx.fillText('> ' + mode + ' <', canvas.width / 2, my);
      } else {
        ctx.fillStyle = '#666';
        ctx.fillText(mode, canvas.width / 2, my);
      }
    });

    // Controls
    ctx.fillStyle = '#aaa';
    ctx.font = '14px monospace';
    let y = 240;

    if (menuSelection === 0) {
      // Solo controls
      const lines = [
        ['A / D  or  Arrows', 'Move'],
        ['W / Space / Up', 'Jump (x2)'],
        ['Q / Shift', 'Dash (invincible)'],
        ['F / J / Z', 'Shoot'],
        ['E', 'Shield (blocks damage)'],
        ['R', 'Reload'],
        ['M', 'Mute / Unmute'],
      ];
      lines.forEach(([key, action]) => {
        ctx.fillStyle = '#4ecdc4';
        ctx.textAlign = 'right';
        ctx.fillText(key, canvas.width / 2 - 15, y);
        ctx.fillStyle = '#aaa';
        ctx.textAlign = 'left';
        ctx.fillText(action, canvas.width / 2 + 15, y);
        y += 24;
      });
    } else if (menuSelection === 1) {
      // Local co-op controls
      ctx.fillStyle = '#3498db';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('P1 (Blue)', canvas.width / 2 - 160, y);
      ctx.fillStyle = '#27ae60';
      ctx.fillText('P2 (Green)', canvas.width / 2 + 160, y);
      y += 24;
      ctx.font = '13px monospace';
      const p1Lines = [
        ['A / D', 'Move'],
        ['W', 'Jump (x2)'],
        ['Q', 'Dash'],
        ['F', 'Shoot'],
        ['E', 'Shield'],
        ['R', 'Reload'],
      ];
      const p2Lines = [
        ['< / >', 'Move'],
        ['Up', 'Jump (x2)'],
        ["'", 'Dash'],
        ['/', 'Shoot'],
        ['.', 'Shield'],
        [';', 'Reload'],
      ];
      for (let i = 0; i < p1Lines.length; i++) {
        ctx.fillStyle = '#4ecdc4';
        ctx.textAlign = 'right';
        ctx.fillText(p1Lines[i][0], canvas.width / 2 - 180, y);
        ctx.fillStyle = '#aaa';
        ctx.textAlign = 'left';
        ctx.fillText(p1Lines[i][1], canvas.width / 2 - 170, y);
        ctx.fillStyle = '#f39c12';
        ctx.textAlign = 'right';
        ctx.fillText(p2Lines[i][0], canvas.width / 2 + 150, y);
        ctx.fillStyle = '#aaa';
        ctx.textAlign = 'left';
        ctx.fillText(p2Lines[i][1], canvas.width / 2 + 160, y);
        y += 22;
      }
      ctx.font = '12px monospace';
      ctx.fillStyle = '#666';
      ctx.textAlign = 'center';
      ctx.fillText('M - Mute / Unmute', canvas.width / 2, y + 8);
    } else {
      // Online co-op controls
      ctx.font = '14px monospace';
      ctx.fillStyle = '#4ecdc4';
      ctx.textAlign = 'center';
      ctx.fillText('Both players use the same keys', canvas.width / 2, y);
      ctx.fillText('on their own computer:', canvas.width / 2, y + 20);
      y += 50;
      const onlineLines = [
        ['A / D  or  Arrows', 'Move'],
        ['W / Space / Up', 'Jump (x2)'],
        ['Q', 'Dash (invincible)'],
        ['F', 'Shoot'],
        ['E', 'Shield (blocks damage)'],
        ['R', 'Reload'],
      ];
      onlineLines.forEach(([key, action]) => {
        ctx.fillStyle = '#4ecdc4';
        ctx.textAlign = 'right';
        ctx.fillText(key, canvas.width / 2 - 15, y);
        ctx.fillStyle = '#aaa';
        ctx.textAlign = 'left';
        ctx.fillText(action, canvas.width / 2 + 15, y);
        y += 22;
      });
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    let blink = Math.sin(Date.now() * 0.004) > 0;
    if (blink) ctx.fillText('Press ENTER to start', canvas.width / 2, 435);

    ctx.fillStyle = '#555';
    ctx.font = '12px monospace';
    ctx.fillText('Up/Down to select mode', canvas.width / 2, 460);

    if (highScore > 0) {
      ctx.fillStyle = '#888';
      ctx.font = '14px monospace';
      ctx.fillText(`High Score: ${highScore}`, canvas.width / 2, 480);
    }
  }

  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 44px monospace';
    ctx.fillText(coopMode ? 'WIPED OUT' : 'WASTED', canvas.width / 2, 180);

    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 28px monospace';
    ctx.fillText(`Score: ${score}`, canvas.width / 2, 240);

    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#4ecdc4';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, 275);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText(`Wave: ${wave}`, canvas.width / 2, 310);

    if (onlineMode && isClient) {
      ctx.fillStyle = '#888';
      ctx.font = '16px monospace';
      let blink = Math.sin(Date.now() * 0.004) > 0;
      if (blink) ctx.fillText('Waiting for host...', canvas.width / 2, 370);
    } else {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px monospace';
      let blink = Math.sin(Date.now() * 0.004) > 0;
      if (blink) ctx.fillText('Press ENTER to retry', canvas.width / 2, 370);
    }
  }

  if (state === 'levelIntro') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#888';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(`LEVEL ${level}`, canvas.width / 2, 160);

    let lvlIntro = getCurrentLevel();
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 40px monospace';
    ctx.fillText(lvlIntro.name.toUpperCase(), canvas.width / 2, 210);

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText(lvlIntro.subtitle, canvas.width / 2, 250);

    let countdown = Math.ceil(levelIntroTimer / 60);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 60px monospace';
    ctx.fillText(`${countdown}`, canvas.width / 2, 340);

    ctx.fillStyle = '#555';
    ctx.font = '14px monospace';
    ctx.fillText('Get ready...', canvas.width / 2, 390);
  }

  if (state === 'levelComplete') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#4ecdc4';
    ctx.font = 'bold 44px monospace';
    ctx.fillText('LEVEL COMPLETE', canvas.width / 2, 170);

    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 24px monospace';
    ctx.fillText(`Score Bonus: +${level * 500}`, canvas.width / 2, 230);

    let lvlComp = getCurrentLevel();
    if (lvlComp.reward) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(`Weapon Unlocked:`, canvas.width / 2, 280);
      ctx.fillStyle = weapons[lvlComp.reward].color;
      ctx.font = 'bold 28px monospace';
      ctx.fillText(weapons[lvlComp.reward].name.toUpperCase(), canvas.width / 2, 315);
    }

    if (onlineMode && isClient) {
      ctx.fillStyle = '#888';
      ctx.font = '16px monospace';
      let blinkLC = Math.sin(Date.now() * 0.004) > 0;
      if (blinkLC) ctx.fillText('Waiting for host...', canvas.width / 2, 390);
    } else {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px monospace';
      let blinkLC = Math.sin(Date.now() * 0.004) > 0;
      if (blinkLC) ctx.fillText('Press ENTER to continue', canvas.width / 2, 390);
    }
  }

  if (state === 'won') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 52px monospace';
    ctx.fillText('VICTORY', canvas.width / 2, 150);

    ctx.fillStyle = '#4ecdc4';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('Congratulations, Gunslinger!', canvas.width / 2, 195);

    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 28px monospace';
    ctx.fillText(`Final Score: ${score}`, canvas.width / 2, 250);

    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, 285);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('You have conquered all 5 levels.', canvas.width / 2, 330);

    if (onlineMode && isClient) {
      ctx.fillStyle = '#888';
      ctx.font = '16px monospace';
      let blinkW = Math.sin(Date.now() * 0.004) > 0;
      if (blinkW) ctx.fillText('Waiting for host...', canvas.width / 2, 400);
    } else {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px monospace';
      let blinkW = Math.sin(Date.now() * 0.004) > 0;
      if (blinkW) ctx.fillText('Press ENTER to play again', canvas.width / 2, 400);
    }
  }

  // ─── ONLINE MENU SCREENS ───
  if (state === 'online-menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 36px monospace';
    ctx.fillText('ONLINE CO-OP', canvas.width / 2, 120);

    ctx.font = 'bold 22px monospace';
    let onlineOpts = ['HOST GAME', 'JOIN GAME'];
    onlineOpts.forEach((opt, i) => {
      let oy = 200 + i * 40;
      if (i === onlineMenuSelection) {
        ctx.fillStyle = '#ffe66d';
        ctx.fillText('> ' + opt + ' <', canvas.width / 2, oy);
      } else {
        ctx.fillStyle = '#666';
        ctx.fillText(opt, canvas.width / 2, oy);
      }
    });

    ctx.fillStyle = '#555';
    ctx.font = '14px monospace';
    ctx.fillText('Press ESC to go back', canvas.width / 2, 340);
  }

  if (state === 'online-host') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 28px monospace';
    ctx.fillText('ROOM CODE', canvas.width / 2, 120);

    ctx.font = 'bold 72px monospace';
    ctx.fillStyle = '#4ecdc4';
    ctx.fillText(roomCode || '...', canvas.width / 2, 220);

    ctx.fillStyle = '#aaa';
    ctx.font = '18px monospace';
    let hostBlink = Math.sin(Date.now() * 0.004) > 0;
    if (hostBlink || connectionStatus !== 'Waiting for player...') {
      ctx.fillText(connectionStatus, canvas.width / 2, 280);
    }

    ctx.fillStyle = '#666';
    ctx.font = '14px monospace';
    ctx.fillText('Share this code with your friend', canvas.width / 2, 330);
    ctx.fillText('Press ESC to cancel', canvas.width / 2, 360);
  }

  if (state === 'online-join') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 28px monospace';
    ctx.fillText('ENTER ROOM CODE', canvas.width / 2, 120);

    let boxW = 60, boxH = 70, gap = 12;
    let totalW = boxW * 4 + gap * 3;
    let startX = (canvas.width - totalW) / 2;
    for (let i = 0; i < 4; i++) {
      let bx = startX + i * (boxW + gap);
      let by = 160;
      ctx.fillStyle = i < roomCodeInput.length ? 'rgba(78,205,196,0.2)' : 'rgba(50,50,80,0.5)';
      ctx.strokeStyle = i === roomCodeInput.length ? '#ffe66d' : '#555';
      ctx.lineWidth = i === roomCodeInput.length ? 3 : 2;
      ctx.beginPath();
      ctx.roundRect(bx, by, boxW, boxH, 6);
      ctx.fill();
      ctx.stroke();
      if (i < roomCodeInput.length) {
        ctx.fillStyle = '#4ecdc4';
        ctx.font = 'bold 40px monospace';
        ctx.fillText(roomCodeInput[i], bx + boxW / 2, by + boxH / 2 + 14);
      }
    }

    if (connectionStatus) {
      ctx.fillStyle = connectionStatus.includes('Error') || connectionStatus.includes('not found') || connectionStatus.includes('failed') ? '#e94560' : '#aaa';
      ctx.font = '16px monospace';
      ctx.fillText(connectionStatus, canvas.width / 2, 290);
    }

    ctx.fillStyle = '#555';
    ctx.font = '14px monospace';
    ctx.fillText('Type the 4-letter code, then press ENTER', canvas.width / 2, 320);
    ctx.fillText('Press ESC to go back', canvas.width / 2, 345);
  }

  // ─── DISCONNECT OVERLAY ───
  if (disconnected) {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 44px monospace';
    ctx.fillText('DISCONNECTED', canvas.width / 2, 220);

    ctx.fillStyle = '#aaa';
    ctx.font = '18px monospace';
    let secs = Math.ceil(disconnectTimer / 60);
    ctx.fillText('Returning to menu in ' + secs + '...', canvas.width / 2, 280);
  }

  // ─── ONLINE HUD INDICATOR ───
  if (onlineMode && (state === 'playing' || state === 'levelIntro')) {
    let connected = conn && conn.open;
    ctx.fillStyle = connected ? '#2ecc71' : '#e94560';
    ctx.beginPath();
    ctx.arc(8, 8, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#aaa';
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(isHost ? 'HOST' : 'P2', 16, 11);
  }
}

// ─── GAME LOOP ───
function gameLoop() {
  update();
  draw();
  updateMusic();
  requestAnimationFrame(gameLoop);
}

gameLoop();
  </script>
</body>
</html>
