const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ─── PROCEDURAL SOUND EFFECTS ───
let audioCtx = null;
let noiseBuffer = null;
let audioInitialized = false;
let muted = false;

function initAudio() {
  if (audioInitialized) return;
  audioInitialized = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const bufferSize = audioCtx.sampleRate * 2;
  noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    output[i] = Math.random() * 2 - 1;
  }
}

function playTone(freq, type, duration, volume, freqEnd) {
  if (!audioCtx || muted) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (freqEnd !== undefined) {
    osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
  }
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, volume, filterFreq) {
  if (!audioCtx || muted) return;
  const source = audioCtx.createBufferSource();
  source.buffer = noiseBuffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = filterFreq;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  source.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  source.start();
  source.stop(audioCtx.currentTime + duration);
}

const SFX = {
  shoot_pistol() {
    playTone(600, 'square', 0.1, 0.15);
    playNoise(0.05, 0.1, 2000);
  },
  shoot_shotgun() {
    playNoise(0.15, 0.25, 800);
    playTone(200, 'square', 0.08, 0.1);
  },
  shoot_smg() {
    playTone(800, 'triangle', 0.05, 0.1);
    playNoise(0.03, 0.05, 3000);
  },
  shoot_rifle() {
    playTone(400, 'sawtooth', 0.12, 0.2);
    playNoise(0.08, 0.15, 1500);
  },
  enemyShoot() {
    playTone(300, 'square', 0.08, 0.08);
  },
  jump() {
    playTone(200, 'sine', 0.15, 0.12, 600);
  },
  doubleJump() {
    playTone(400, 'sine', 0.15, 0.12, 1000);
  },
  dash() {
    playNoise(0.15, 0.15, 600);
  },
  playerHit() {
    playTone(100, 'sine', 0.2, 0.2);
    playNoise(0.1, 0.15, 500);
  },
  playerDeath() {
    playTone(500, 'sawtooth', 0.4, 0.2, 100);
  },
  enemyHit() {
    playNoise(0.06, 0.1, 2000);
  },
  enemyDeath() {
    playNoise(0.2, 0.2, 400);
    playTone(80, 'square', 0.25, 0.15);
  },
  explosion() {
    playNoise(0.3, 0.3, 300);
    playTone(50, 'sine', 0.35, 0.25);
  },
  pickup() {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime;
    [523, 659, 784].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.15, t + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t + i * 0.08);
      osc.stop(t + i * 0.08 + 0.15);
    });
  },
  reload() {
    playNoise(0.03, 0.15, 3000);
  },
  waveStart() {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime;
    [0, 0.12].forEach(offset => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.12, t + offset);
      gain.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t + offset);
      osc.stop(t + offset + 0.08);
    });
  },
  levelComplete() {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime;
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t + i * 0.15);
      gain.gain.linearRampToValueAtTime(0.15, t + i * 0.15 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t + i * 0.15);
      osc.stop(t + i * 0.15 + 0.3);
    });
  },
  victory() {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime;
    [523, 659, 784, 1047, 1319].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t + i * 0.18);
      gain.gain.linearRampToValueAtTime(0.18, t + i * 0.18 + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.18 + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t + i * 0.18);
      osc.stop(t + i * 0.18 + 0.45);
    });
  },
  gameOver() {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime;
    [400, 300, 200].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t + i * 0.25);
      gain.gain.linearRampToValueAtTime(0.18, t + i * 0.25 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.25 + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t + i * 0.25);
      osc.stop(t + i * 0.25 + 0.4);
    });
  },
  menuSelect() {
    playTone(660, 'square', 0.1, 0.12);
  },
};

// ─── LEVEL DEFINITIONS ───
const levels = [

function getCurrentLevel() {
  let idx = Math.min(level - 1, levels.length - 1);
  return levels[idx];
}

// ─── PLAYER ───
const GROUND = canvas.height - 60;
const GRAVITY = 0.6;
const JUMP_FORCE = -13;
const DOUBLE_JUMP_FORCE = -11;
const MOVE_SPEED = 3.5;
const DASH_SPEED = 18;
const DASH_DURATION = 8;
const SHOOT_COOLDOWN = 8;

let player = createPlayer();

function createPlayer() {
  return {
    x: canvas.width / 2, y: GROUND, w: 28, h: 44,
    vx: 0, vy: 0,
    facing: 1,
    onGround: true,
    jumps: 2,
    health: 5,
    maxHealth: 5,
    shootCooldown: 0,
    dashing: false,
    dashTimer: 0,
    dashCooldown: 0,
    invincible: 0,
    ammo: 30,
    maxAmmo: 30,
    reloading: false,
    reloadTimer: 0,
    weapon: 'pistol',
    trail: []
  };
}

// ─── COLLECTIONS ───
let bullets = [];
let enemies = [];
let particles = [];
let powerups = [];
let floatingTexts = [];
let platforms = [];
let casings = [];
let stars = [];

// Generate starfield
for (let i = 0; i < 80; i++) {
  stars.push({ x: Math.random() * canvas.width, y: Math.random() * (GROUND - 40), size: Math.random() * 2 + 0.5, twinkle: Math.random() * Math.PI * 2 });
}

// ─── KEYS ───
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  initAudio();
  if (e.key.toLowerCase() === 'm') { muted = !muted; return; }

  if (state === 'menu' && (e.key === 'Enter' || e.key === ' ')) { startGame(); return; }
  if (state === 'dead' && (e.key === 'Enter' || e.key === ' ')) { startGame(); return; }
  if (state === 'won' && (e.key === 'Enter' || e.key === ' ')) { startGame(); return; }
  if (state === 'levelComplete' && (e.key === 'Enter' || e.key === ' ')) {
    level++;
    startLevel();
    return;
  }

  if (state === 'playing') {
    // Jump
    if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && player.jumps > 0) {
      if (player.jumps === 1) SFX.doubleJump(); else SFX.jump();
      player.vy = player.jumps === 2 ? JUMP_FORCE : DOUBLE_JUMP_FORCE;
      player.onGround = false;
      player.jumps--;
      spawnJumpDust();
      if (player.jumps === 0) spawnDoubleJumpEffect();
    }
    // Dash
    if ((e.key === 'Shift') && player.dashCooldown <= 0 && !player.dashing) {
      SFX.dash();
      player.dashing = true;
      player.dashTimer = DASH_DURATION;
      player.dashCooldown = 40;
      player.invincible = DASH_DURATION;
      player.vx = player.facing * DASH_SPEED;
      screenShake = 3;
      for (let i = 0; i < 8; i++) {
        particles.push({ x: player.x, y: player.y + player.h / 2, vx: -player.facing * (Math.random() * 4 + 2), vy: (Math.random() - 0.5) * 3, life: 15, maxLife: 15, color: '#4ecdc4', size: 4 });
      }
    }
    // Reload
    if (e.key === 'r' && !player.reloading && player.ammo < player.maxAmmo) {
      player.reloading = true;
      player.reloadTimer = 40;
    }
  }
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Mute button click handler
const MUTE_BTN = { x: canvas.width - 38, y: canvas.height - 32, w: 26, h: 22 };
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
  if (cx >= MUTE_BTN.x && cx <= MUTE_BTN.x + MUTE_BTN.w &&
      cy >= MUTE_BTN.y && cy <= MUTE_BTN.y + MUTE_BTN.h) {
    muted = !muted;
  }
});

// ─── WEAPON DEFINITIONS ───
const weapons = {
  pistol: { name: 'Pistol', fireRate: 10, damage: 1, speed: 10, spread: 0.03, ammo: 30, color: '#ffe66d', size: 3, auto: false },
  shotgun: { name: 'Shotgun', fireRate: 30, damage: 1, speed: 8, spread: 0.15, ammo: 12, pellets: 5, color: '#ff6b6b', size: 3, auto: false },
  smg: { name: 'SMG', fireRate: 6, damage: 0.5, speed: 11, spread: 0.08, ammo: 50, color: '#4ecdc4', size: 2, auto: true },
  rifle: { name: 'Rifle', fireRate: 25, damage: 3, speed: 15, spread: 0.01, ammo: 10, color: '#ff9f43', size: 4, auto: false },

// ─── ENEMY TYPES ───
const enemyTypes = {
  basic: { w: 24, h: 40, health: 2, speed: 0.8, shootRate: 130, color: '#e94560', bulletSpeed: 3, score: 100 },
  fast: { w: 20, h: 36, health: 1, speed: 1.8, shootRate: 100, color: '#ff9f43', bulletSpeed: 3.5, score: 150 },
  tank: { w: 34, h: 48, health: 5, speed: 0.4, shootRate: 140, color: '#8b5cf6', bulletSpeed: 2.5, score: 300 },
  sniper: { w: 22, h: 42, health: 2, speed: 0.3, shootRate: 170, color: '#06d6a0', bulletSpeed: 7, score: 250 },
  bomber: { w: 28, h: 38, health: 2, speed: 1, shootRate: 0, color: '#ff006e', bulletSpeed: 0, score: 200, bomber: true },
  boss: { w: 50, h: 64, health: 50, speed: 1.1, shootRate: 28, color: '#ff0000', bulletSpeed: 6.5, score: 2000, boss: true },
};

// ─── PLATFORMS ───
function generatePlatforms() {
  let lvl = getCurrentLevel();
  platforms = lvl.platforms.map(p => ({
    x: p.x, y: GROUND + p.y, w: p.w, h: p.h
  }));
}

// ─── START GAME ───
function startGame() {
  SFX.menuSelect();
  player = createPlayer();
  bullets = [];
  enemies = [];
  particles = [];
  powerups = [];
  floatingTexts = [];
  casings = [];
  score = 0;
  level = 1;
  wave = 0;
  waveTimer = 60;
  killStreak = 0;
  killStreakTimer = 0;
  screenShake = 0;
  startLevel();
}

function startLevel() {
  let lvl = getCurrentLevel();
  wavesPerLevel = lvl.waves;
  wave = 0;
  waveTimer = 60;
  bullets = [];
  enemies = [];
  powerups = [];
  generatePlatforms();
  state = 'levelIntro';
  levelIntroTimer = 180; // 3 seconds
}

function completeLevel() {
  SFX.levelComplete();
  state = 'levelComplete';
  levelTransitionTimer = 240; // 4 seconds
  let lvl = getCurrentLevel();
  // Give reward weapon
  if (lvl.reward) {
    player.weapon = lvl.reward;
    player.ammo = weapons[lvl.reward].ammo;
    player.maxAmmo = weapons[lvl.reward].ammo;
    player.reloading = false;
  }
  // Heal player
  player.health = Math.min(player.maxHealth, player.health + 2);
  score += level * 500;
}

// ─── SPAWN ───
function spawnWave() {
  wave++;
  let lvl = getCurrentLevel();

  // Check if level is complete
  if (wave > wavesPerLevel) {
    if (level >= levels.length) {
      // Game won!
      SFX.victory();
      state = 'won';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('shooterBest', highScore.toString());
      }
      return;
    }
    completeLevel();
    return;
  }

  let count = Math.min(2 + wave + level, 14);
  let types = lvl.enemyTypes;

  // Last wave of level 5 spawns a boss
  if (lvl.hasBoss && wave === wavesPerLevel) {
    spawnEnemy('boss');
    count = Math.floor(count / 2);
  }

  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      if (state !== 'playing') return;
      let type = types[Math.floor(Math.random() * types.length)];
      spawnEnemy(type);
    }, i * 400);
  }

  // Power-up drop
  if (wave % 2 === 0) {
    setTimeout(() => spawnPowerup(), 1000);
  }

  waveTimer = 300 + count * 60;
  SFX.waveStart();
  addFloatingText(`WAVE ${wave}/${wavesPerLevel}`, canvas.width / 2, 100, '#fff', 28, 90);
}

function spawnEnemy(type) {
  let def = enemyTypes[type];
  let lvl = getCurrentLevel();
  let scale = lvl.enemyScale;
  let fromRight = Math.random() > 0.5;
  let x = fromRight ? canvas.width + 30 : -30;
  let y = GROUND;
  // Sometimes spawn on platforms
  if (Math.random() > 0.5 && platforms.length > 0) {
    let p = platforms[Math.floor(Math.random() * platforms.length)];
    y = p.y - def.h;
    x = p.x + Math.random() * p.w;
  }
  enemies.push({
    x, y, ...def, type,
    health: Math.ceil(def.health * scale),
    maxHealth: Math.ceil(def.health * scale),
    speed: def.speed * (0.9 + scale * 0.2),
    bulletSpeed: def.bulletSpeed * (0.9 + scale * 0.15),
    facing: fromRight ? -1 : 1,
    shootTimer: Math.floor(Math.random() * def.shootRate),
    vy: 0,
    hit: 0,
    deathTimer: 0,
    alive: true,
    patrolDir: fromRight ? -1 : 1,
  });
}

function spawnPowerup() {
  let types = ['health', 'shotgun', 'smg', 'rifle', 'slowmo'];
  let type = types[Math.floor(Math.random() * types.length)];
  let colors = { health: '#ff6b6b', shotgun: '#ff6b6b', smg: '#4ecdc4', rifle: '#ff9f43', slowmo: '#c77dff' };
  powerups.push({
    x: 100 + Math.random() * (canvas.width - 200),
    y: GROUND - 200 - Math.random() * 100,
    vy: 0,
    w: 20, h: 20,
    type, color: colors[type],
    life: 600,
  });
}

// ─── EFFECTS ───
function spawnMuzzleFlash(x, y, dir) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x, y, vx: dir * (Math.random() * 6 + 3), vy: (Math.random() - 0.5) * 3,
      life: 6, maxLife: 6, color: '#ffe66d', size: 3 + Math.random() * 3
    });
  }
}

function spawnBlood(x, y) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8 - 2,
      life: 25, maxLife: 25, color: '#e94560', size: 2 + Math.random() * 3
    });
  }
}

function spawnExplosion(x, y, color = '#ff9f43', count = 20) {
  screenShake = 8;
  for (let i = 0; i < count; i++) {
    let angle = (Math.PI * 2 / count) * i + Math.random() * 0.3;
    let speed = Math.random() * 6 + 2;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1,
      life: 30, maxLife: 30, color, size: 3 + Math.random() * 4
    });
  }
}

function spawnJumpDust() {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: player.x, y: player.y + player.h,
      vx: (Math.random() - 0.5) * 4, vy: Math.random() * -1,
      life: 15, maxLife: 15, color: '#888', size: 3
    });
  }
}

function spawnDoubleJumpEffect() {
  for (let i = 0; i < 10; i++) {
    let angle = (Math.PI * 2 / 10) * i;
    particles.push({
      x: player.x, y: player.y + player.h / 2,
      vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3,
      life: 12, maxLife: 12, color: '#4ecdc4', size: 3
    });
  }
}

function spawnCasing(x, y, dir) {
  casings.push({ x, y, vx: -dir * (Math.random() * 3 + 1), vy: -(Math.random() * 4 + 2), rotation: 0, vr: (Math.random() - 0.5) * 0.4, grounded: false });
}

function addFloatingText(text, x, y, color = '#fff', size = 16, life = 60) {
  floatingTexts.push({ text, x, y, color, size, life, maxLife: life });
}

// ─── SHOOTING ───
function playerShoot() {
  if (player.shootCooldown > 0 || player.reloading || player.ammo <= 0) return;

  let wep = weapons[player.weapon];
  player.shootCooldown = wep.fireRate;
  let pellets = wep.pellets || 1;

  for (let i = 0; i < pellets; i++) {
    let spread = (Math.random() - 0.5) * wep.spread * 2;
    let bx = player.x + player.facing * 20;
    let by = player.y + 14;
    bullets.push({
      x: bx, y: by,
      vx: Math.cos(spread) * wep.speed * player.facing,
      vy: Math.sin(spread) * wep.speed,
      damage: wep.damage,
      color: wep.color,
      size: wep.size,
      isPlayer: true,
      life: 80,
      trail: [],
    });
  }

  player.ammo--;
  if (player.ammo <= 0) {
    player.reloading = true;
    player.reloadTimer = 50;
  }

  if (SFX['shoot_' + player.weapon]) SFX['shoot_' + player.weapon]();
  spawnMuzzleFlash(player.x + player.facing * 24, player.y + 14, player.facing);
  spawnCasing(player.x, player.y + 10, player.facing);
  screenShake = Math.max(screenShake, wep.fireRate > 15 ? 4 : 2);
}

function enemyShoot(enemy) {
  let dx = player.x - enemy.x;
  let dy = (player.y + player.h / 2) - (enemy.y + enemy.h / 2);
  let dist = Math.sqrt(dx * dx + dy * dy);
  if (dist === 0) return;
  let speed = enemy.bulletSpeed;
  SFX.enemyShoot();
  bullets.push({
    x: enemy.x + enemy.facing * 15,
    y: enemy.y + enemy.h / 2 - 4,
    vx: (dx / dist) * speed,
    vy: (dy / dist) * speed,
    damage: 1,
    color: enemy.color,
    size: 3,
    isPlayer: false,
    life: 120,
    trail: [],
  });
}

// ─── UPDATE ───
function update() {
  // Handle level intro countdown
  if (state === 'levelIntro') {
    levelIntroTimer--;
    if (levelIntroTimer <= 0) {
      state = 'playing';
    }
    return;
  }
  // Handle level complete countdown
  if (state === 'levelComplete') {
    levelTransitionTimer--;
    if (levelTransitionTimer <= 0) {
      level++;
      startLevel();
    }
    return;
  }
  if (state !== 'playing') return;

  let dt = slowMo;
  if (slowMoTimer > 0) {
    slowMoTimer--;
    slowMo = 0.4;
    if (slowMoTimer <= 0) slowMo = 1;
  } else {
    slowMo = 1;
  }

  // Player movement
  let moveDir = 0;
  if (keys['arrowleft'] || keys['a']) moveDir = -1;
  if (keys['arrowright'] || keys['d']) moveDir = 1;

  if (!player.dashing) {
    player.vx = moveDir * MOVE_SPEED;
  }

  if (player.dashing) {
    player.dashTimer--;
    if (player.dashTimer <= 0) player.dashing = false;
  }
  if (player.dashCooldown > 0) player.dashCooldown--;
  if (player.invincible > 0) player.invincible--;

  if (moveDir !== 0 && !player.dashing) player.facing = moveDir;

  // Auto-fire
  let wep = weapons[player.weapon];
  if (keys['j'] || keys['f'] || keys['z']) {
    playerShoot();
  }
  if (wep.auto && (keys['j'] || keys['f'] || keys['z']) && player.shootCooldown <= 0) {
    playerShoot();
  }

  if (player.shootCooldown > 0) player.shootCooldown -= dt;

  // Reload
  if (player.reloading) {
    player.reloadTimer -= dt;
    if (player.reloadTimer <= 0) {
      SFX.reload();
      player.reloading = false;
      player.ammo = weapons[player.weapon].ammo;
    }
  }

  // Physics
  player.vy += GRAVITY * dt;
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // Trail
  if (player.dashing || Math.abs(player.vx) > 3) {
    player.trail.push({ x: player.x, y: player.y, alpha: 0.5 });
    if (player.trail.length > 8) player.trail.shift();
  } else {
    if (player.trail.length > 0) player.trail.shift();
  }

  // Ground
  player.onGround = false;
  if (player.y + player.h >= GROUND) {
    player.y = GROUND - player.h;
    player.vy = 0;
    player.onGround = true;
    player.jumps = 2;
  }

  // Platform collision
  platforms.forEach(p => {
    if (player.vy >= 0 &&
        player.x + player.w / 2 > p.x && player.x - player.w / 2 < p.x + p.w &&
        player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + 10) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumps = 2;
    }
  });

  // Bounds
  player.x = Math.max(player.w / 2, Math.min(canvas.width - player.w / 2, player.x));

  // ─── ENEMIES ───
  enemies.forEach(e => {
    if (!e.alive) return;
    if (e.hit > 0) e.hit--;

    // AI Movement
    let toPlayer = player.x - e.x;
    let dist = Math.abs(toPlayer);

    if (e.type === 'bomber') {
      // Bombers rush toward the player
      e.facing = toPlayer > 0 ? 1 : -1;
      e.x += e.facing * e.speed * dt;
      if (dist < 30) {
        SFX.explosion();
        spawnExplosion(e.x, e.y + e.h / 2, '#ff006e', 30);
        if (player.invincible <= 0) {
          player.health--;
          screenShake = 10;
        }
        e.alive = false;
        score += e.score;
        return;
      }
    } else if (e.boss) {
      // Boss AI - aggressive, multi-shot, stomps
      e.facing = toPlayer > 0 ? 1 : -1;
      if (dist > 150) {
        e.x += e.facing * e.speed * dt;
      } else if (dist < 60) {
        e.x -= e.facing * e.speed * 0.3 * dt;
      }
      // Multi-shot burst
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = e.shootRate + Math.random() * 10;
        for (let s = 0; s < 3; s++) {
          setTimeout(() => {
            if (!e.alive || state !== 'playing') return;
            enemyShoot(e);
            screenShake = 3;
          }, s * 80);
        }
      }
      // Boss stomp/jump
      if (!e._jumpTimer) e._jumpTimer = 200;
      e._jumpTimer -= dt;
      if (e._jumpTimer <= 0 && e.y + e.h >= GROUND - 2) {
        e.vy = -10;
        e._jumpTimer = 180 + Math.random() * 120;
        SFX.explosion();
        spawnExplosion(e.x, e.y + e.h, '#ff4444', 8);
      }
    } else {
      // Others patrol and shoot
      if (dist > 200) {
        e.facing = toPlayer > 0 ? 1 : -1;
        e.x += e.facing * e.speed * dt;
      } else if (dist < 80) {
        e.facing = toPlayer > 0 ? 1 : -1;
        e.x -= e.facing * e.speed * 0.5 * dt;
      } else {
        e.facing = toPlayer > 0 ? 1 : -1;
      }

      // Shoot
      e.shootTimer -= dt;
      if (e.shootTimer <= 0 && e.shootRate > 0) {
        e.shootTimer = e.shootRate + Math.random() * 20;
        enemyShoot(e);
      }
    }

    // Gravity
    e.vy += GRAVITY * dt;
    e.y += e.vy * dt;

    if (e.y + e.h >= GROUND) {
      e.y = GROUND - e.h;
      e.vy = 0;
    }

    // Platform collision for enemies
    platforms.forEach(p => {
      if (e.vy >= 0 &&
          e.x + e.w / 2 > p.x && e.x - e.w / 2 < p.x + p.w &&
          e.y + e.h >= p.y && e.y + e.h <= p.y + p.h + 8) {
        e.y = p.y - e.h;
        e.vy = 0;
      }
    });

    // Bounds
    e.x = Math.max(e.w / 2, Math.min(canvas.width - e.w / 2, e.x));
  });

  // ─── BULLETS ───
  bullets.forEach(b => {
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 6) b.trail.shift();

    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    if (b.isPlayer) {
      // Hit enemies
      enemies.forEach(e => {
        if (!e.alive) return;
        if (Math.abs(b.x - e.x) < e.w / 2 + b.size && Math.abs(b.y - (e.y + e.h / 2)) < e.h / 2 + b.size) {
          e.health -= b.damage;
          e.hit = 6;
          b.life = 0;
          spawnBlood(b.x, b.y);
          SFX.enemyHit();
          screenShake = Math.max(screenShake, 2);

          if (e.health <= 0) {
            e.alive = false;
            score += e.score;
            killStreak++;
            killStreakTimer = 120;

            if (killStreak >= 3) {
              let mult = Math.min(killStreak, 10);
              let bonus = e.score * (mult - 1);
              score += bonus;
              addFloatingText(`${killStreak}x COMBO! +${bonus}`, e.x, e.y - 20, '#ffe66d', 20, 60);
            }

            SFX.enemyDeath();
            spawnExplosion(e.x, e.y + e.h / 2, e.color);
            addFloatingText(`+${e.score}`, e.x, e.y, '#fff', 14, 40);
          }
        }
      });
    } else {
      // Hit player
      if (player.invincible <= 0 &&
          Math.abs(b.x - player.x) < player.w / 2 + b.size &&
          Math.abs(b.y - (player.y + player.h / 2)) < player.h / 2 + b.size) {
        player.health--;
        b.life = 0;
        screenShake = 6;
        player.invincible = 30;
        SFX.playerHit();
        spawnBlood(player.x, player.y + player.h / 2);
        addFloatingText('-1', player.x, player.y, '#ff6b6b', 20, 40);

        if (player.health <= 0) {
          SFX.playerDeath();
          SFX.gameOver();
          state = 'dead';
          spawnExplosion(player.x, player.y + player.h / 2, '#ffe66d', 40);
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('shooterBest', highScore.toString());
          }
        }
      }
    }
  });

  // Clean up
  bullets = bullets.filter(b => b.life > 0 && b.x > -50 && b.x < canvas.width + 50 && b.y > -50 && b.y < canvas.height + 50);
  enemies = enemies.filter(e => e.alive);

  // ─── POWERUPS ───
  powerups.forEach(p => {
    p.vy += 0.15;
    p.y += p.vy;
    p.life--;

    // Ground
    if (p.y + p.h >= GROUND) { p.y = GROUND - p.h; p.vy = 0; }

    // Platform
    platforms.forEach(plat => {
      if (p.vy >= 0 && p.x + p.w / 2 > plat.x && p.x - p.w / 2 < plat.x + plat.w &&
          p.y + p.h >= plat.y && p.y + p.h <= plat.y + plat.h + 8) {
        p.y = plat.y - p.h; p.vy = 0;
      }
    });

    // Pickup
    if (Math.abs(p.x - player.x) < 25 && Math.abs(p.y - (player.y + player.h / 2)) < 30) {
      SFX.pickup();
      p.life = 0;
      spawnExplosion(p.x, p.y, p.color, 10);
      if (p.type === 'health') {
        player.health = Math.min(player.maxHealth, player.health + 2);
        addFloatingText('+2 HP', p.x, p.y - 10, '#ff6b6b', 18, 50);
      } else if (p.type === 'slowmo') {
        slowMoTimer = 180;
        addFloatingText('SLOW-MO!', p.x, p.y - 10, '#c77dff', 18, 50);
      } else {
        player.weapon = p.type;
        player.ammo = weapons[p.type].ammo;
        player.maxAmmo = weapons[p.type].ammo;
        player.reloading = false;
        addFloatingText(weapons[p.type].name.toUpperCase() + '!', p.x, p.y - 10, p.color, 18, 50);
      }
    }
  });
  powerups = powerups.filter(p => p.life > 0);

  // ─── PARTICLES ───
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.1;
    p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);

  // Casings
  casings.forEach(c => {
    if (!c.grounded) {
      c.vy += 0.3;
      c.x += c.vx;
      c.y += c.vy;
      c.rotation += c.vr;
      if (c.y >= GROUND - 2) { c.y = GROUND - 2; c.grounded = true; }
    }
  });
  if (casings.length > 50) casings.splice(0, casings.length - 50);

  // Floating texts
  floatingTexts.forEach(t => { t.y -= 0.5; t.life--; });
  floatingTexts = floatingTexts.filter(t => t.life > 0);

  // Kill streak decay
  if (killStreakTimer > 0) killStreakTimer--;
  else killStreak = 0;

  // Screen shake decay
  if (screenShake > 0) screenShake *= 0.85;
  if (screenShake < 0.5) screenShake = 0;

  // Wave management
  waveTimer -= dt;
  if (enemies.length === 0 && waveTimer <= 0) {
    spawnWave();
  }

  // Weapon timeout - revert to pistol after a while
  if (player.weapon !== 'pistol' && player.ammo <= 0 && !player.reloading) {
    player.weapon = 'pistol';
    player.ammo = weapons.pistol.ammo;
    player.maxAmmo = weapons.pistol.ammo;
  }
}

// ─── BACKDROP ───
function drawBackdrop(type) {
  let lvl = getCurrentLevel();
  let time = Date.now() * 0.001;

  if (type === 'city') {
    // Tall building silhouettes
    let buildings = [
      { x: 30, w: 60, h: 200 }, { x: 120, w: 45, h: 260 },
      { x: 200, w: 70, h: 180 }, { x: 310, w: 55, h: 300 },
      { x: 400, w: 80, h: 220 }, { x: 520, w: 50, h: 280 },
      { x: 600, w: 65, h: 190 }, { x: 700, w: 75, h: 310 },
      { x: 800, w: 55, h: 240 },
    ];
    buildings.forEach(b => {
      let by = GROUND - b.h;
      ctx.fillStyle = 'rgba(10,10,30,0.6)';
      ctx.fillRect(b.x, by, b.w, b.h);
      // Lit windows
      for (let wy = by + 15; wy < GROUND - 20; wy += 22) {
        for (let wx = b.x + 8; wx < b.x + b.w - 8; wx += 14) {
          let on = Math.sin(wx * 3.7 + wy * 2.1 + time * 0.3) > 0.2;
          if (on) {
            ctx.fillStyle = 'rgba(255,230,100,0.25)';
            ctx.fillRect(wx, wy, 6, 8);
          }
        }
      }
    });
    // Neon signs
    ctx.globalAlpha = 0.3 + Math.sin(time * 2) * 0.15;
    ctx.fillStyle = lvl.groundLine;
    ctx.fillRect(135, GROUND - 230, 20, 6);
    ctx.fillRect(530, GROUND - 250, 25, 6);
    ctx.globalAlpha = 1;

  } else if (type === 'rooftops') {
    // Low building outlines
    let roofs = [
      { x: 0, w: 140, h: 80 }, { x: 180, w: 100, h: 50 },
      { x: 320, w: 160, h: 70 }, { x: 530, w: 120, h: 90 },
      { x: 690, w: 100, h: 55 }, { x: 820, w: 80, h: 75 },
    ];
    roofs.forEach(r => {
      let ry = GROUND - r.h;
      ctx.fillStyle = 'rgba(20,10,30,0.5)';
      ctx.fillRect(r.x, ry, r.w, r.h);
      // Rooftop edge
      ctx.fillStyle = 'rgba(40,20,50,0.4)';
      ctx.fillRect(r.x, ry, r.w, 4);
    });
    // Antennas
    ctx.strokeStyle = 'rgba(100,60,120,0.4)';
    ctx.lineWidth = 2;
    [[70, GROUND - 80, 45], [350, GROUND - 70, 35], [560, GROUND - 90, 50]].forEach(([ax, ay, ah]) => {
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax, ay - ah); ctx.stroke();
      ctx.fillStyle = 'rgba(255,80,80,0.5)';
      ctx.beginPath(); ctx.arc(ax, ay - ah, 2, 0, Math.PI * 2); ctx.fill();
    });
    // Water towers
    ctx.fillStyle = 'rgba(30,15,40,0.5)';
    ctx.fillRect(740, GROUND - 100, 24, 20);
    ctx.fillRect(736, GROUND - 105, 32, 8);
    // Legs
    ctx.strokeStyle = 'rgba(30,15,40,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(740, GROUND - 80); ctx.lineTo(738, GROUND - 55); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(764, GROUND - 80); ctx.lineTo(766, GROUND - 55); ctx.stroke();

  } else if (type === 'warehouse') {
    // Large rectangular structures
    ctx.fillStyle = 'rgba(15,25,15,0.5)';
    ctx.fillRect(50, GROUND - 150, 200, 150);
    ctx.fillRect(650, GROUND - 130, 200, 130);
    // Corrugated walls
    ctx.strokeStyle = 'rgba(30,50,30,0.3)';
    ctx.lineWidth = 1;
    for (let wx = 55; wx < 245; wx += 12) {
      ctx.beginPath(); ctx.moveTo(wx, GROUND - 145); ctx.lineTo(wx, GROUND); ctx.stroke();
    }
    for (let wx = 655; wx < 845; wx += 12) {
      ctx.beginPath(); ctx.moveTo(wx, GROUND - 125); ctx.lineTo(wx, GROUND); ctx.stroke();
    }
    // Pipes
    ctx.strokeStyle = 'rgba(60,100,60,0.35)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(250, GROUND - 120); ctx.lineTo(350, GROUND - 120);
    ctx.lineTo(350, GROUND - 40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(550, GROUND - 100); ctx.lineTo(650, GROUND - 100); ctx.stroke();
    // Roof slope
    ctx.fillStyle = 'rgba(20,35,20,0.4)';
    ctx.beginPath();
    ctx.moveTo(50, GROUND - 150); ctx.lineTo(150, GROUND - 170);
    ctx.lineTo(250, GROUND - 150); ctx.closePath(); ctx.fill();

  } else if (type === 'docks') {
    // Cranes
    ctx.strokeStyle = 'rgba(40,50,80,0.45)';
    ctx.lineWidth = 4;
    // Left crane
    ctx.beginPath(); ctx.moveTo(100, GROUND); ctx.lineTo(100, GROUND - 250); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100, GROUND - 250); ctx.lineTo(200, GROUND - 250); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(200, GROUND - 250); ctx.lineTo(200, GROUND - 180); ctx.stroke();
    // Right crane
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(750, GROUND); ctx.lineTo(750, GROUND - 220); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(750, GROUND - 220); ctx.lineTo(650, GROUND - 220); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(650, GROUND - 220); ctx.lineTo(650, GROUND - 160); ctx.stroke();
    // Shipping containers
    let containers = [
      { x: 300, w: 60, h: 30, c: 'rgba(80,30,30,0.4)' },
      { x: 360, w: 60, h: 30, c: 'rgba(30,30,80,0.4)' },
      { x: 330, w: 60, h: 30, c: 'rgba(30,70,30,0.4)', stack: true },
      { x: 500, w: 60, h: 30, c: 'rgba(80,60,20,0.4)' },
    ];
    containers.forEach(c => {
      let cy = c.stack ? GROUND - 60 : GROUND - 30;
      ctx.fillStyle = c.c;
      ctx.fillRect(c.x, cy, c.w, c.h);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      ctx.strokeRect(c.x, cy, c.w, c.h);
    });
    // Water reflections at ground level
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = lvl.groundLine;
    for (let wx = 0; wx < canvas.width; wx += 30) {
      let rw = 10 + Math.sin(wx * 0.5 + time) * 5;
      ctx.fillRect(wx, GROUND + 5, rw, 2);
    }
    ctx.globalAlpha = 1;

  } else if (type === 'ruins') {
    // Broken buildings
    ctx.fillStyle = 'rgba(30,10,10,0.5)';
    // Left ruin - jagged top
    ctx.beginPath();
    ctx.moveTo(40, GROUND); ctx.lineTo(40, GROUND - 160);
    ctx.lineTo(60, GROUND - 180); ctx.lineTo(80, GROUND - 140);
    ctx.lineTo(100, GROUND - 170); ctx.lineTo(120, GROUND - 120);
    ctx.lineTo(140, GROUND); ctx.closePath(); ctx.fill();
    // Center ruin
    ctx.beginPath();
    ctx.moveTo(380, GROUND); ctx.lineTo(380, GROUND - 130);
    ctx.lineTo(400, GROUND - 150); ctx.lineTo(420, GROUND - 100);
    ctx.lineTo(450, GROUND - 140); ctx.lineTo(470, GROUND - 90);
    ctx.lineTo(500, GROUND - 110); ctx.lineTo(520, GROUND);
    ctx.closePath(); ctx.fill();
    // Right ruin
    ctx.beginPath();
    ctx.moveTo(720, GROUND); ctx.lineTo(720, GROUND - 190);
    ctx.lineTo(750, GROUND - 160); ctx.lineTo(770, GROUND - 200);
    ctx.lineTo(800, GROUND - 150); ctx.lineTo(830, GROUND - 180);
    ctx.lineTo(850, GROUND); ctx.closePath(); ctx.fill();
    // Rubble piles
    ctx.fillStyle = 'rgba(40,15,15,0.4)';
    [[200, 30], [550, 25], [680, 20]].forEach(([rx, rh]) => {
      ctx.beginPath();
      ctx.moveTo(rx - 30, GROUND); ctx.quadraticCurveTo(rx, GROUND - rh, rx + 30, GROUND);
      ctx.fill();
    });
    // Smoke wisps
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#aaa';
    [90, 450, 780].forEach(sx => {
      let sy = GROUND - 140 + Math.sin(sx) * 30;
      for (let i = 0; i < 3; i++) {
        let offset = Math.sin(time + i * 2 + sx) * 15;
        ctx.beginPath();
        ctx.arc(sx + offset, sy - i * 20, 8 + i * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
  }
}

// ─── DRAW ───
function draw() {
  ctx.save();

  // Screen shake
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake * 2, (Math.random() - 0.5) * screenShake * 2);
  }

  // Level theme
  let lvl = getCurrentLevel();

  // Sky gradient
  let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, lvl.sky[0]);
  grad.addColorStop(0.6, lvl.sky[1]);
  grad.addColorStop(1, lvl.sky[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  let time = Date.now() * 0.002;
  stars.forEach(s => {
    let alpha = 0.3 + Math.sin(time + s.twinkle) * 0.3;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  // Backdrop
  drawBackdrop(lvl.backdrop);

  // Ground
  let groundGrad = ctx.createLinearGradient(0, GROUND, 0, canvas.height);
  groundGrad.addColorStop(0, lvl.ground[0]);
  groundGrad.addColorStop(0.3, lvl.ground[1]);
  groundGrad.addColorStop(1, lvl.ground[2]);
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, GROUND, canvas.width, canvas.height - GROUND);
  // Ground surface line with glow
  ctx.shadowColor = lvl.groundGlow;
  ctx.shadowBlur = 6;
  ctx.strokeStyle = lvl.groundLine;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(canvas.width, GROUND);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // Ground texture - small dashes
  ctx.strokeStyle = lvl.groundLine.replace(')', ',0.2)').replace('rgb', 'rgba').replace('#', '');
  ctx.globalAlpha = 0.2;
  ctx.strokeStyle = lvl.groundLine;
  ctx.lineWidth = 1;
  for (let gx = 0; gx < canvas.width; gx += 18) {
    let gy = GROUND + 8 + (gx * 7 % 13);
    ctx.beginPath();
    ctx.moveTo(gx, gy);
    ctx.lineTo(gx + 6 + (gx % 5), gy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Ground edge highlight dots
  for (let gx = 0; gx < canvas.width; gx += 40) {
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = lvl.groundLine;
    ctx.beginPath();
    ctx.arc(gx + 20, GROUND + 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Platforms
  platforms.forEach(p => {
    // Platform body with gradient
    let platGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    platGrad.addColorStop(0, '#3a3a6a');
    platGrad.addColorStop(1, '#2a2a4a');
    ctx.fillStyle = platGrad;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, 3);
    ctx.fill();
    // Top surface glow
    ctx.shadowColor = '#6a6aff';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = '#7a7abb';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x + 3, p.y);
    ctx.lineTo(p.x + p.w - 3, p.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Support brackets
    ctx.fillStyle = '#222244';
    ctx.fillRect(p.x + 8, p.y + p.h, 4, 8);
    ctx.fillRect(p.x + p.w - 12, p.y + p.h, 4, 8);
  });

  // Casings
  ctx.fillStyle = '#b8860b';
  casings.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rotation);
    ctx.fillRect(-3, -1, 6, 2);
    ctx.restore();
  });

  // Particles
  particles.forEach(p => {
    let alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // Bullets
  bullets.forEach(b => {
    // Trail
    b.trail.forEach((t, i) => {
      let alpha = (i / b.trail.length) * 0.4;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    // Bullet glow
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // Powerups
  powerups.forEach(p => {
    let bob = Math.sin(Date.now() * 0.005) * 3;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2 + bob, p.w, p.h);
    ctx.shadowBlur = 0;
    // Icon
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    let icon = p.type === 'health' ? '+' : p.type === 'slowmo' ? 'S' : p.type[0].toUpperCase();
    ctx.fillText(icon, p.x, p.y + 4 + bob);
  });

  // Enemies
  enemies.forEach(e => {
    if (!e.alive) return;
    let shake = e.hit > 0 ? (Math.random() - 0.5) * 4 : 0;
    let eColor = e.hit > 0 ? '#fff' : e.color;
    let eSkin = e.hit > 0 ? '#fff' : '#cba984';
    let eWalk = Math.sin(Date.now() * 0.01 + e.x) * 5;

    ctx.save();
    ctx.translate(e.x + shake, e.y);

    if (e.boss) {
      // ── BOSS RENDERING ──
      let bossTime = Date.now() * 0.003;

      // Pulsing aura
      let auraPulse = 0.15 + Math.sin(bossTime) * 0.1;
      ctx.globalAlpha = auraPulse;
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#ff0000';
      ctx.beginPath();
      ctx.arc(0, e.h * 0.4, e.w * 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

      // Legs (thicker)
      let eLegBottom = e.h - 3;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#222';
      ctx.beginPath();
      ctx.moveTo(-6, e.h * 0.62);
      ctx.lineTo(-8 - eWalk, eLegBottom);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(6, e.h * 0.62);
      ctx.lineTo(8 + eWalk, eLegBottom);
      ctx.stroke();
      // Heavy boots
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.ellipse(-8 - eWalk, eLegBottom, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(8 + eWalk, eLegBottom, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Torso (wider)
      ctx.fillStyle = eColor;
      let tw = e.w * 0.85;
      ctx.beginPath();
      ctx.moveTo(-tw / 2, e.h * 0.24);
      ctx.lineTo(-tw / 2 - 3, e.h * 0.62);
      ctx.lineTo(tw / 2 + 3, e.h * 0.62);
      ctx.lineTo(tw / 2, e.h * 0.24);
      ctx.closePath();
      ctx.fill();
      // Chest armor detail
      ctx.strokeStyle = 'rgba(255,100,100,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-8, e.h * 0.32);
      ctx.lineTo(0, e.h * 0.42);
      ctx.lineTo(8, e.h * 0.32);
      ctx.stroke();

      // Arms (thicker)
      ctx.strokeStyle = eSkin;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-e.facing * 8, e.h * 0.3);
      ctx.lineTo(-e.facing * 14, e.h * 0.5 + eWalk * 0.5);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.facing * 8, e.h * 0.3);
      ctx.lineTo(e.facing * 16, e.h * 0.36);
      ctx.stroke();

      // Big gun
      ctx.fillStyle = '#555';
      ctx.fillRect(e.facing * 16, e.h * 0.33 - 3, e.facing * 18, 5);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(e.facing * 16, e.h * 0.33 - 4, e.facing * 3, 7);

      // Head (larger)
      ctx.fillStyle = eSkin;
      let headR = e.w * 0.34;
      ctx.beginPath();
      ctx.arc(0, e.h * 0.16, headR, 0, Math.PI * 2);
      ctx.fill();

      // Crown/Horns
      ctx.fillStyle = '#cc0000';
      // Left horn
      ctx.beginPath();
      ctx.moveTo(-headR + 2, e.h * 0.1);
      ctx.lineTo(-headR - 4, e.h * 0.16 - headR - 14);
      ctx.lineTo(-headR + 8, e.h * 0.06);
      ctx.closePath();
      ctx.fill();
      // Right horn
      ctx.beginPath();
      ctx.moveTo(headR - 2, e.h * 0.1);
      ctx.lineTo(headR + 4, e.h * 0.16 - headR - 14);
      ctx.lineTo(headR - 8, e.h * 0.06);
      ctx.closePath();
      ctx.fill();
      // Center spike
      ctx.beginPath();
      ctx.moveTo(-4, e.h * 0.05);
      ctx.lineTo(0, e.h * 0.16 - headR - 10);
      ctx.lineTo(4, e.h * 0.05);
      ctx.closePath();
      ctx.fill();

      // Glowing red eyes
      let eyeGlow = 0.7 + Math.sin(bossTime * 2) * 0.3;
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 12;
      ctx.fillStyle = `rgba(255,0,0,${eyeGlow})`;
      let eeXL = -5;
      let eeXR = 5;
      let eeY = e.h * 0.15;
      ctx.beginPath();
      ctx.ellipse(eeXL, eeY, 3, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(eeXR, eeY, 3, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Eye glint
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(eeXL + e.facing, eeY - 1, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eeXR + e.facing, eeY - 1, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Angry brow
      ctx.strokeStyle = '#660000';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(eeXL - 4, eeY - 5);
      ctx.lineTo(eeXL + 4, eeY - 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(eeXR + 4, eeY - 5);
      ctx.lineTo(eeXR - 4, eeY - 3);
      ctx.stroke();

      // Big health bar
      let hbW = 60;
      let hbH = 7;
      ctx.fillStyle = '#333';
      ctx.fillRect(-hbW / 2, -18, hbW, hbH);
      let hpRatio = e.health / e.maxHealth;
      let hpColor = hpRatio > 0.5 ? '#ff0000' : hpRatio > 0.25 ? '#ff6600' : '#ff0000';
      ctx.fillStyle = hpColor;
      ctx.fillRect(-hbW / 2, -18, hbW * hpRatio, hbH);
      ctx.strokeStyle = '#aa0000';
      ctx.lineWidth = 1;
      ctx.strokeRect(-hbW / 2, -18, hbW, hbH);
      // "BOSS" label
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', 0, -21);

    } else {
      // ── NORMAL ENEMY RENDERING ──

      // ── Legs ──
      let eLegBottom = e.h - 3;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#333';
      ctx.beginPath();
      ctx.moveTo(-3, e.h * 0.62);
      ctx.lineTo(-5 - eWalk, eLegBottom);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(3, e.h * 0.62);
      ctx.lineTo(5 + eWalk, eLegBottom);
      ctx.stroke();
      // Shoes
      ctx.fillStyle = '#444';
      ctx.beginPath();
      ctx.ellipse(-5 - eWalk, eLegBottom, 4, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(5 + eWalk, eLegBottom, 4, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // ── Torso ──
      ctx.fillStyle = eColor;
      let tw = e.w * 0.8;
      ctx.beginPath();
      ctx.moveTo(-tw / 2, e.h * 0.28);
      ctx.lineTo(-tw / 2 - 1, e.h * 0.62);
      ctx.lineTo(tw / 2 + 1, e.h * 0.62);
      ctx.lineTo(tw / 2, e.h * 0.28);
      ctx.closePath();
      ctx.fill();

      // ── Arms ──
      ctx.strokeStyle = eSkin;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      // Back arm
      ctx.beginPath();
      ctx.moveTo(-e.facing * 5, e.h * 0.32);
      ctx.lineTo(-e.facing * 9, e.h * 0.5 + eWalk * 0.5);
      ctx.stroke();
      // Gun arm
      ctx.beginPath();
      ctx.moveTo(e.facing * 5, e.h * 0.32);
      ctx.lineTo(e.facing * 11, e.h * 0.38);
      ctx.stroke();

      // ── Gun ──
      if (!e.bomber) {
        ctx.fillStyle = '#666';
        ctx.fillRect(e.facing * 11, e.h * 0.36 - 2, e.facing * 12, 3);
      }

      // ── Head ──
      ctx.fillStyle = eSkin;
      let headR = e.w * 0.32;
      ctx.beginPath();
      ctx.arc(0, e.h * 0.2, headR, 0, Math.PI * 2);
      ctx.fill();

      // ── Bandana/headgear ──
      ctx.fillStyle = eColor;
      ctx.beginPath();
      ctx.arc(0, e.h * 0.2 - 2, headR, Math.PI, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      let eeX = e.facing > 0 ? 2 : -5;
      ctx.beginPath();
      ctx.ellipse(eeX, e.h * 0.19, 2.5, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(eeX + e.facing, e.h * 0.19, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Angry eyebrow
      ctx.strokeStyle = eColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(eeX - 3, e.h * 0.14 + (e.facing > 0 ? 2 : 0));
      ctx.lineTo(eeX + 3, e.h * 0.14 + (e.facing > 0 ? 0 : 2));
      ctx.stroke();

      // Health bar
      if (e.health < e.maxHealth) {
        ctx.fillStyle = '#333';
        ctx.fillRect(-e.w / 2, -12, e.w, 4);
        ctx.fillStyle = e.color;
        ctx.fillRect(-e.w / 2, -12, e.w * (e.health / e.maxHealth), 4);
      }

      // Bomber warning - blinking vest
      if (e.bomber) {
        let blink = Math.sin(Date.now() * 0.015) > 0;
        ctx.fillStyle = blink ? '#ff006e' : '#aa0044';
        ctx.fillRect(-tw / 2 + 2, e.h * 0.35, tw - 4, 8);
        if (blink) {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(0, e.h * 0.39, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    ctx.restore();
  });

  // Player
  if (state === 'playing') {
    // Trail
    player.trail.forEach((t, i) => {
      let alpha = (i / player.trail.length) * 0.3;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = player.dashing ? '#4ecdc4' : '#3498db';
      ctx.fillRect(t.x - player.w / 2, t.y, player.w, player.h);
    });
    ctx.globalAlpha = 1;

    // Invincibility flash
    if (player.invincible > 0 && Math.floor(player.invincible / 3) % 2 === 0) {
      ctx.globalAlpha = 0.5;
    }

    ctx.save();
    ctx.translate(player.x, player.y);

    let walkCycle = (player.onGround && Math.abs(player.vx) > 0.5) ? Math.sin(Date.now() * 0.012) : 0;
    let bodyColor = player.dashing ? '#4ecdc4' : '#3498db';
    let skinColor = '#f4d35e';

    // ── Legs ──
    let legSpread = walkCycle * 6;
    let legBottom = player.h - 4;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    // Left leg
    ctx.strokeStyle = '#2c3e50';
    ctx.beginPath();
    ctx.moveTo(-4, 28);
    ctx.lineTo(-6 - legSpread, legBottom);
    ctx.stroke();
    // Right leg
    ctx.beginPath();
    ctx.moveTo(4, 28);
    ctx.lineTo(6 + legSpread, legBottom);
    ctx.stroke();
    // Shoes
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.ellipse(-6 - legSpread, legBottom, 5, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(6 + legSpread, legBottom, 5, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── Torso ──
    ctx.fillStyle = bodyColor;
    // Rounded torso
    ctx.beginPath();
    ctx.moveTo(-10, 14);
    ctx.lineTo(-11, 28);
    ctx.lineTo(11, 28);
    ctx.lineTo(10, 14);
    ctx.closePath();
    ctx.fill();
    // Belt
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(-10, 26, 20, 3);
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(-2, 26, 4, 3);

    // ── Back arm ──
    ctx.strokeStyle = skinColor;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    let backArmSwing = walkCycle * 4;
    ctx.beginPath();
    ctx.moveTo(-player.facing * 6, 17);
    ctx.lineTo(-player.facing * 10, 26 + backArmSwing);
    ctx.stroke();

    // ── Gun arm ──
    let gunArmY = 18;
    ctx.strokeStyle = skinColor;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(player.facing * 6, 17);
    ctx.lineTo(player.facing * 13, gunArmY);
    ctx.stroke();

    // ── Gun ──
    ctx.fillStyle = '#7f8c8d';
    ctx.save();
    ctx.translate(player.facing * 13, gunArmY);
    // Gun body
    ctx.fillStyle = '#95a5a6';
    ctx.fillRect(0, -3, player.facing * 16, 5);
    // Gun grip
    ctx.fillStyle = '#5d4e37';
    ctx.fillRect(0, 2, player.facing * 4, 5);
    // Gun barrel tip
    ctx.fillStyle = '#bdc3c7';
    ctx.fillRect(player.facing * 14, -2, player.facing * 3, 3);
    ctx.restore();

    // ── Head ──
    ctx.fillStyle = skinColor;
    ctx.beginPath();
    ctx.arc(0, 8, 10, 0, Math.PI * 2);
    ctx.fill();

    // ── Hair/Hat ──
    ctx.fillStyle = '#2c3e50';
    // Hat brim
    ctx.fillRect(-13, 1, 26, 4);
    // Hat top
    ctx.beginPath();
    ctx.moveTo(-9, 4);
    ctx.lineTo(-8, -6);
    ctx.lineTo(8, -6);
    ctx.lineTo(9, 4);
    ctx.closePath();
    ctx.fill();
    // Hat band
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(-9, 0, 18, 3);

    // ── Face ──
    // Eye
    ctx.fillStyle = '#fff';
    let eyeX = player.facing > 0 ? 3 : -6;
    ctx.beginPath();
    ctx.ellipse(eyeX, 7, 3, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(eyeX + player.facing * 1, 7, 1.5, 0, Math.PI * 2);
    ctx.fill();
    // Mouth - little smirk
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(player.facing * 3, 12, 3, 0.1, Math.PI * 0.8);
    ctx.stroke();

    // ── Dash indicator ──
    if (player.dashCooldown > 0) {
      ctx.fillStyle = 'rgba(78,205,196,0.3)';
      ctx.fillRect(-player.w / 2, player.h + 6, player.w * (1 - player.dashCooldown / 40), 3);
    } else {
      ctx.fillStyle = '#4ecdc4';
      ctx.fillRect(-player.w / 2, player.h + 6, player.w, 3);
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Floating texts
  floatingTexts.forEach(t => {
    let alpha = t.life / t.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.color;
    ctx.font = `bold ${t.size}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
  });
  ctx.globalAlpha = 1;

  // ─── HUD ───
  // Health
  ctx.fillStyle = '#333';
  ctx.fillRect(20, 15, 150, 14);
  ctx.fillStyle = player.health > 2 ? '#2ecc71' : player.health > 1 ? '#f39c12' : '#e74c3c';
  ctx.fillRect(20, 15, 150 * (player.health / player.maxHealth), 14);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, 15, 150, 14);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`HP ${player.health}/${player.maxHealth}`, 95, 26);

  // Ammo
  ctx.textAlign = 'left';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = player.reloading ? '#f39c12' : '#fff';
  let ammoText = player.reloading ? `[RELOADING...]` : `${weapons[player.weapon].name}: ${player.ammo}/${player.maxAmmo}`;
  ctx.fillText(ammoText, 20, 48);

  // Score
  ctx.textAlign = 'right';
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#ffe66d';
  ctx.fillText(`${score}`, canvas.width - 20, 30);
  ctx.font = '12px monospace';
  ctx.fillStyle = '#888';
  ctx.fillText(`BEST: ${highScore}`, canvas.width - 20, 48);

  // Wave
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#888';
  ctx.fillText(`LVL ${level} - WAVE ${wave}/${wavesPerLevel}`, canvas.width / 2, 28);

  // Kill streak
  if (killStreak >= 3) {
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`${killStreak}x STREAK`, canvas.width / 2, 48);
  }

  // Slow-mo indicator
  if (slowMoTimer > 0) {
    ctx.fillStyle = '#c77dff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SLOW-MO: ${Math.ceil(slowMoTimer / 60)}s`, 20, 68);
  }

  // Mute button (bottom-right)
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.roundRect(MUTE_BTN.x, MUTE_BTN.y, MUTE_BTN.w, MUTE_BTN.h, 4);
  ctx.fill();
  ctx.fillStyle = muted ? '#e94560' : '#fff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  if (muted) {
    ctx.fillText('\\', MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + 16);
    ctx.fillStyle = 'rgba(233,69,96,0.5)';
    ctx.font = '10px monospace';
    ctx.fillText('OFF', MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + MUTE_BTN.h + 10);
  } else {
    ctx.fillText(')))', MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + 16);
  }

  ctx.restore();

  // ─── MENUS ───
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('GUNSLINGER', canvas.width / 2, 140);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('ARENA', canvas.width / 2, 175);

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    let y = 230;
    const lines = [
      ['A / D  or  Arrows', 'Move'],
      ['W / Space / Up', 'Jump (x2)'],
      ['Shift', 'Dash (invincible)'],
      ['F / J / Z', 'Shoot'],
      ['R', 'Reload'],
    ];
    lines.forEach(([key, action]) => {
      ctx.fillStyle = '#4ecdc4';
      ctx.textAlign = 'right';
      ctx.fillText(key, canvas.width / 2 - 20, y);
      ctx.fillStyle = '#aaa';
      ctx.textAlign = 'left';
      ctx.fillText(action, canvas.width / 2 + 20, y);
      y += 28;
    });

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    let blink = Math.sin(Date.now() * 0.004) > 0;
    if (blink) ctx.fillText('Press ENTER to start', canvas.width / 2, 420);

    if (highScore > 0) {
      ctx.fillStyle = '#888';
      ctx.font = '14px monospace';
      ctx.fillText(`High Score: ${highScore}`, canvas.width / 2, 455);
    }
  }

  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 44px monospace';
    ctx.fillText('WASTED', canvas.width / 2, 180);

    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 28px monospace';
    ctx.fillText(`Score: ${score}`, canvas.width / 2, 240);

    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#4ecdc4';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, 275);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText(`Wave: ${wave}`, canvas.width / 2, 310);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    let blink = Math.sin(Date.now() * 0.004) > 0;
    if (blink) ctx.fillText('Press ENTER to retry', canvas.width / 2, 370);
  }

  if (state === 'levelIntro') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#888';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(`LEVEL ${level}`, canvas.width / 2, 160);

    let lvlIntro = getCurrentLevel();
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 40px monospace';
    ctx.fillText(lvlIntro.name.toUpperCase(), canvas.width / 2, 210);

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText(lvlIntro.subtitle, canvas.width / 2, 250);

    let countdown = Math.ceil(levelIntroTimer / 60);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 60px monospace';
    ctx.fillText(`${countdown}`, canvas.width / 2, 340);

    ctx.fillStyle = '#555';
    ctx.font = '14px monospace';
    ctx.fillText('Get ready...', canvas.width / 2, 390);
  }

  if (state === 'levelComplete') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#4ecdc4';
    ctx.font = 'bold 44px monospace';
    ctx.fillText('LEVEL COMPLETE', canvas.width / 2, 170);

    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 24px monospace';
    ctx.fillText(`Score Bonus: +${level * 500}`, canvas.width / 2, 230);

    let lvlComp = getCurrentLevel();
    if (lvlComp.reward) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(`Weapon Unlocked:`, canvas.width / 2, 280);
      ctx.fillStyle = weapons[lvlComp.reward].color;
      ctx.font = 'bold 28px monospace';
      ctx.fillText(weapons[lvlComp.reward].name.toUpperCase(), canvas.width / 2, 315);
    }

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    let blinkLC = Math.sin(Date.now() * 0.004) > 0;
    if (blinkLC) ctx.fillText('Press ENTER to continue', canvas.width / 2, 390);
  }

  if (state === 'won') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 52px monospace';
    ctx.fillText('VICTORY', canvas.width / 2, 150);

    ctx.fillStyle = '#4ecdc4';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('Congratulations, Gunslinger!', canvas.width / 2, 195);

    ctx.fillStyle = '#ffe66d';
    ctx.font = 'bold 28px monospace';
    ctx.fillText(`Final Score: ${score}`, canvas.width / 2, 250);

    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, 285);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('You have conquered all 5 levels.', canvas.width / 2, 330);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    let blinkW = Math.sin(Date.now() * 0.004) > 0;
    if (blinkW) ctx.fillText('Press ENTER to play again', canvas.width / 2, 400);
  }
}

// ─── GAME LOOP ───
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
  </script>
</body>
</html>
